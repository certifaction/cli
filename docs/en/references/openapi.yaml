openapi: "3.0.2"

info:
  title: Certifaction Local API
  description: |
    A proxy server for integrating with the Certifaction platform.

    ## Setup requirements

    1. Authentication is required to perform some operations. Please refer to the [Authentication](https://developers.certifaction.com/en/references/authentication) section to obtain an API Key or token.
    2. Start the local server on the CLI using the command `certifaction server`

    Refer to [our setup guide](https://developers.certifaction.com/en/guides/getting-started-api#getting-started-with-the-local-api) to get started.

  version: ""

servers:
  - url: http://localhost:{port}
    variables:
      port:
        default: "8081"

security:
  - api_key: [ ]

tags:
  - name: Signing
    description: Sign files and request signatures
  - name: Documents
    description: Download your documents or remove Certifaction's access to them
  - name: Account
    description: Access your user account data
  - name: Signing Processes
    description: Create and manage signing processes
  - name: Organization
    description: Manage organisation-level settings
  - name: Server
    description: Check the server's status
  - name: Certification
    description: Blockchain certification

components:
  parameters:
    additional_page:
      name: additional-page
      description: Whether to place Digital Twin and signatures on an additional page or inline.
      in: query
      schema:
        type: boolean
        default: true
    digital_twin:
      name: digital-twin
      description: Enable [Digital Twin](https://certifaction.com/digital-twin/) for the document.
      in: query
      schema:
        type: boolean
        default: false
    pdf-a:
      name: pdf-a
      description: Enable PDF/A compatibility
      in: query
      schema:
        type: boolean
        default: false
    accept_language:
      name: Accept-Language
      description: |
        The language for text object placed added to the document. Pass `de` for German, `en` for English,
        `fr` for French, or `it` for Italian.
      in: header
      schema:
        $ref: "#/components/schemas/language"
    prepare_scope:
      name: scope
      in: query
      schema:
        $ref: "#/components/schemas/prepare_scope"
      required: true
    qr_llx:
      name: qr-llx
      description: |
        The x-coordinate of the Digital Twin QR code from the lower left corner of the document.
        This is required when `additional-page=false`.
      in: query
      schema:
        type: number
    qr_lly:
      name: qr-lly
      description: |
        The y-coordinate of the Digital Twin QR code from the lower left corner of the document.
        This is required when `additional-page=false`.
      in: query
      schema:
        type: number
    qr_height:
      name: qr-height
      description: The height of the Digital Twin QR code. This is required when `additional-page=false`.
      in: query
      schema:
        type: number
    qr_page:
      name: qr-page
      description: The page to place the Digital Twin QR code on. This is required when `additional-page=false`.
      in: query
      schema:
        type: integer
    encryption_key:
      name: encryption-key
      description: A hexadecimal string to encrypt the document with.
      in: query
      schema:
        type: string
    password_encryption:
      name: password-encryption
      description: The password encryption algorithm to use in encrypting the encryption key.
      in: query
      schema:
        type: string
        enum:
          - xor-b58
    placeholder:
      name: placeholder
      description: |
        Enable placeholder mode to detect and process signature placeholders in the PDF document.

        When enabled, the prepare endpoint will:
        - Detect `##SIG{...}` text placeholders in the document
        - Store their positions for later signature placement
        - Remove the placeholder text from the document

        ## Text Placeholder Format

        Add text placeholders directly in your PDF document using this JSON-based format:

        ```
        ##SIG{"id":"signer1","w":"9cm","x":"2cm","y":"1cm"}
        ```

        ### Field Descriptions

        - **id** (required): The field name/identifier for the signature placeholder
          - Note: `role` can be used instead of `id` for backwards compatibility
        - **w** (optional): Width of the signature box
          - Supports units: `cm`, `mm`, `in`, `pt`
          - If specified, height is calculated automatically to maintain aspect ratio
          - Examples: `"w":"9cm"`, `"w":"100pt"`, `"w":"2in"`
        - **h** (optional): Height of the signature box
          - Supports units: `cm`, `mm`, `in`, `pt`
          - Only used if width (`w`) is not specified
          - Examples: `"h":"3cm"`
        - **x** (optional): Horizontal offset from the text position
          - Supports units: `cm`, `mm`, `in`, `pt`
          - Positive values move the signature to the right
          - Examples: `"x":"2cm"`
        - **y** (optional): Vertical offset from the text position
          - Supports units: `cm`, `mm`, `in`, `pt`
          - Positive values move the signature down
          - Examples: `"y":"1cm"`

        ### Examples

        ```
        ##SIG{"id":"manager","w":"8cm"}
        ##SIG{"id":"director","w":"100pt","x":"1cm","y":"0.5cm"}
        ##SIG{"id":"witness","h":"2cm","x":"3cm"}
        ```

        ### Notes

        - If neither `w` nor `h` is specified, the signature uses the default base width
        - Width (`w`) takes precedence over height (`h`) to maintain proper aspect ratio
        - Position offsets (`x`, `y`) are relative to where the `##SIG{...}` text appears in the document
      in: query
      schema:
        type: boolean
        default: false
    placeholder_id:
      name: placeholder-id
      description: |
        ID of the signature placeholder field to use for signature placement.
        If specified, the signature will be placed at the position of the placeholder with this ID.

        This parameter references the `id` field in a `##SIG{...}` placeholder (e.g., for `##SIG{"id":"manager"}`, use `placeholder-id=manager`).

        When using this parameter, position-related flags (position-x, position-y, height, page) are ignored.
      in: query
      schema:
        type: string

  responses:
    bad_request:
      description: The request is not properly formed. For example, the content could not be read.
    unauthorized:
      description: You are not authorized to carry out the operation. Check that your API key is correct.
    forbidden:
      description: You do not have permission to carry out the operation. For example you might not have the required role.
    not_found:
      description: The requested resource was not found.
    conflict:
      description: Conflict detected in the request. For example, a user might have already been joined an organization.
    internal_server_error:
      description: An error occurred on the server

  securitySchemes:
    api_key:
      name: Authorization
      in: header
      type: apiKey

  schemas:
    envelope_item_status:
      type: string
      enum:
        - unsigned
        - awaiting_upload
        - signed
        - cancelled

    language:
      type: string
      enum:
        - de
        - en
        - fr
        - it

    legal_weight:
      type: string
      enum:
        - AES
        - QES
        - SES

    scope:
      type: string
      enum:
        - register
        - sign
        - certify
        - revoke
        - retract
    prepare_scope:
      type: string
      enum:
        - sign
        - certify
        - attachment

    identity:
      properties:
        uid:
          type: string
        user_uid:
          type: string
        issuer:
          type: string
        status:
          type: string
        verification_url:
          type: string
        verification_id:
          type: string
        evidence_url:
          type: string
        proof:
          type: string
        name:
          type: string
        given_name:
          type: string
        family_name:
          type: string
        birthday:
          type: string
        signature_level:
          type: string
        signature_jurisdiction:
          type: string
      required:
        - uid
        - user_uid
        - issuer
        - status
        - verification_url
        - verification_id
        - evidence_url
        - proof
        - name
        - given_name
        - family_name
        - birthday

    organization:
      properties:
        id:
          type: string
        name:
          type: string
          maxLength: 80
          minLength: 2
        subscription_type:
          type: string
        quota:
          type: integer
      required:
        - id

    user:
      properties:
        id:
          type: integer
        uid:
          type: string
        external_id:
          type: string
        email:
          type: string
        title:
          type: string
        name:
          type: string
        first_name:
          type: string
        middle_names:
          type: string
        last_name:
          type: string
        affiliation:
          type: string
        address:
          type: string
        postalcode:
          type: string
        location:
          type: string
        eth_address:
          type: string
        quota:
          type: integer
        disabled:
          type: boolean
        file_suffix:
          type: string
        permissions:
          type: array
          items:
            type: string
        subscription_type:
          type: string
        encrypt_claims:
          type: boolean
        verified_by:
          type: string
        features:
          type: object
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/organization"
        identities:
          type: array
          items:
            $ref: "#/components/schemas/identity"
        theme:
          properties:
            name:
              type: string
          required:
            - name
        name_verified:
          type: boolean

    verified_by:
      properties:
        name:
          type: string
        image:
          type: string

    verification_issuer:
      properties:
        id:
          type: string
        title:
          type: string
        name:
          type: string
        email:
          type: string
        verified:
          type: boolean
        verified_by:
          $ref: "#/components/schemas/verified_by"

    blockchain_entry:
      properties:
        type:
          type: string
        contract_address:
          type: string
        tx_hash:
          type: string
        date:
          type: string
          format: date-time

    verification_signature:
      properties:
        jurisdiction:
          type: string
        level:
          type: string
        pkcs7_data:
          type: string

    verification_event:
      properties:
        ref:
          type: string
        encrypted:
          type: boolean
        issuer:
          $ref: "#/components/schemas/verification_issuer"
        scope:
          type: string
        note:
          type: string
        signature:
          $ref: "#/components/schemas/verification_signature"
        date:
          type: string
          format: date-time
        on_blockchain:
          $ref: "#/components/schemas/blockchain_entry"

    verification_file_info:
      properties:
        hash:
          type: string
        status:
          type: string
          enum:
            - registering
            - registered
            - revoking
            - revoked

    verification_result:
      properties:
        verified:
          type: boolean
          description: Whether the file is verified
        authentic:
          type: boolean
          description: Whether the file is authentic
        on_blockchain:
          type: boolean
          description: Whether the file is on blockchain
        encrypted:
          type: boolean
          description: Whether the file is encrypted
        revoked:
          type: boolean
          description: Whether the file has been revoked
        file:
          $ref: "#/components/schemas/verification_file_info"
        events:
          type: array
          items:
            $ref: "#/components/schemas/verification_event"
        claims:
          type: array
          items:
            type: object
        issuer_name:
          type: string
          deprecated: true
          description: "Deprecated: use events.issuer instead"
        issuer_verifiedby:
          type: string
          deprecated: true
          description: "Deprecated: use events.issuer instead"
        issuer_img:
          type: string
          deprecated: true
          description: "Deprecated: use events.issuer instead"
        issuer_address:
          type: string
          deprecated: true
          description: "Deprecated: use events.issuer instead"
        issuer_verified:
          type: boolean
          deprecated: true
          description: "Deprecated: use events.issuer instead"
        issuer_title:
          type: string
          deprecated: true
          description: "Deprecated: use events.issuer instead"

    signer:
      type: object
      properties:
        email:
          type: string
        name:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        language:
          type: string
        message:
          type: string
        sign_order:
          type: integer
        participation_role:
          type: string
          enum: ["signer", "approver", "observer"]
        webhook_url:
          type: string
          format: url
          description: URL to receive webhook notifications about this signer's signature request status changes.
        envelope_items:
          type: array
          items:
            $ref: "#/components/schemas/envelope_item_input"

    envelope_item_input:
      type: object
      properties:
        link:
          type: string
          description: Digital archive link for the document.
        file_id:
          type: string
          description: File ID (derived from link if not provided).
        document_id:
          type: string
          description: Document ID (derived from link if not provided).
        filename:
          type: string
        legal_weight:
          $ref: "#/components/schemas/legal_weight"
        jurisdiction:
          type: string
          enum: ["ZertES", "eIDAS"]
        signature_position:
          type: string
          deprecated: true
          description: "Deprecated: use `signature_positions` instead."
        signature_positions:
          type: array
          description: Structured signature positions to place on this document.
          items:
            $ref: "#/components/schemas/signature_position_input"

    envelope_item:
      type: object
      properties:
        link:
          type: string
          description: Digital archive link for the document.
        file_id:
          type: string
          description: File ID (derived from link if not provided).
        document_id:
          type: string
          description: Document ID (derived from link if not provided).
        filename:
          type: string
        legal_weight:
          $ref: "#/components/schemas/legal_weight"
        jurisdiction:
          type: string
          enum: ["ZertES", "eIDAS"]
        signature_position:
          type: string
          deprecated: true
          description: "Deprecated: use `signature_positions` instead."
        signature_positions:
          type: array
          description: Signature positions for this document, in the API representation.
          items:
            $ref: "#/components/schemas/signature_position_output"
        status:
          type: string
          description: Envelope item status (present in responses).
          readOnly: true
          enum: ["unsigned", "awaiting_approval", "awaiting_upload", "signed", "approved", "declined", "declined_confirmed", "cancelled", "attachment", "for_observation"]
        signed_at:
          type: string
          format: date-time

    signature_position_input:
      type: object
      description: |
        A structured signature position. Coordinates are absolute PDF user space
        units, or fractions of the page dimensions when `positioning` is "relative".
        Signature positions are only supported for SES signatures.
      properties:
        pageNo:
          type: integer
          description: Page number for signature placement (1-based).
        llx:
          type: number
          description: Lower-left X coordinate.
        lly:
          type: number
          description: Lower-left Y coordinate.
        height:
          type: number
          description: Height of the signature field.
        rotate:
          type: integer
          description: Rotation angle in degrees (0, 90, 180, 270).
        positioning:
          type: string
          enum: ["", "relative", "placeholder"]
          description: '"relative" for relative positioning, empty for absolute.'
        placeholder:
          type: string
          description: ID of a signature placeholder field in the document, used with `positioning=placeholder`.
        legalWeight:
          type: string
          description: Legal weight - only SES supported.
        jurisdiction:
          type: string
          enum: ["eIDAS", "ZertES"]
          description: Legal jurisdiction.

    signature_position_output:
      type: object
      description: A signature position as returned by the API.
      properties:
        position:
          type: string
          description: The position, encoded as a JSON string.
        legal_weight:
          type: string
        jurisdiction:
          type: string
          enum: ["eIDAS", "ZertES"]
        status:
          type: string
        sign_order:
          type: integer

    signature_request_response:
      type: object
      properties:
        id:
          type: string
        signing_process_id:
          type: string
        legal_weight:
          $ref: "#/components/schemas/legal_weight"
        jurisdiction:
          type: string
          enum: ["ZertES", "eIDAS"]
        cancelled:
          type: boolean
        signed:
          type: boolean
        signer:
          $ref: "#/components/schemas/user"
        requester:
          $ref: "#/components/schemas/user"
        envelope_items:
          type: array
          items:
            $ref: "#/components/schemas/envelope_item"
        used_identification_at:
          type: string
          format: date-time
        identification_method:
          type: string
        created_at:
          type: string
          format: date-time

    signing_process:
      properties:
        process_id:
          type: string
        name:
          type: string
        owner_uid:
          type: string
        created_at:
          type: string
          format: date-time
        status:
          type: string
        tag_ids:
          type: array
          items:
            type: string
        is_individual:
          type: boolean
        total:
          type: integer
          description: Total number of documents in the signing process.
        signed:
          type: integer
          description: Number of documents that have been signed in the signing process.
        cancelled:
          type: integer
          description: Number of documents that have been cancelled in the signing process.
        signature_requests:
          type: array
          items:
            $ref: "#/components/schemas/signature_request_response"

    signing_process_list:
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/signing_process"
        total_pages:
          type: integer
        total_elements:
          type: integer
        page:
          type: integer

    org_reminder:
      type: object
      description: |
        Organisation-level signing-process reminder setting
        (`organization.signingprocess.reminder`).

        When `enforced` is true, the cadence and message override per-request
        and per-template reminder values for every signing process in the
        organisation, and the upstream API syncs existing templates that already
        have reminders to match. When `enforced` is false the setting is
        dormant and per-request / per-template values take effect.

        `message` is tri-state: omit the field to preserve each template's
        existing message during the bulk sync, send an explicit empty string to
        deliberately blank every template's message, or send a non-empty string
        to overwrite.
      properties:
        enforced:
          type: boolean
          description: Whether the org policy overrides per-request and per-template reminder values.
        intervals:
          type: integer
          minimum: 1
          maximum: 14
          description: Reminder cadence in days.
        max:
          type: integer
          minimum: 1
          maximum: 5
          description: Maximum number of reminders to send.
        message:
          type: string
          maxLength: 500
          description: Reminder message body. Omit to preserve existing per-template messages; send `""` to blank them.

paths:
  /delete-access:
    post:
      operationId: remove_access
      summary: Remove Certifaction's access to a file
      requestBody:
        description: The file that you want to remove Certifaction's access for.
        required: true
        content:
          application/pdf: { }
      responses:
        200:
          description: File access was removed successfully.
        400:
          $ref: "#/components/responses/bad_request"
        401:
          $ref: "#/components/responses/unauthorized"
      tags:
        - Documents

  /download:
    get:
      summary: Download files
      parameters:
        - name: file
          description: A Digital Archive URL
          in: query
          required: true
          schema:
            type: string
            format: url
        - name: password
          description: The signature request password, if Privacy 2.0 was enabled
          in: query
          schema:
            type: string
      operationId: download_file
      responses:
        200:
          description: File download content.
          content:
            application/pdf:
              schema:
                type: string
            application/zip:
              schema:
                type: string
        400:
          $ref: "#/components/responses/bad_request"
        401:
          $ref: "#/components/responses/unauthorized"
      security: [ ]
      tags:
        - Documents

  /health:
    get:
      operationId: server_health_check
      summary: Check server health
      responses:
        200:
          description: Health check response.
          content:
            application/json:
              schema:
                properties:
                  description:
                    type: string
                  service_name:
                    type: string
                  status:
                    type: string
      security: [ ]
      tags:
        - Server

  /ping:
    get:
      summary: Check that the API server is running
      responses:
        200:
          description: The server is up and running.
          content:
            text/plain:
              schema:
                type: string
                enum:
                  - pong
      security: [ ]
      tags:
        - Server

  /prepare:
    post:
      operationId: prepare_file
      parameters:
        - $ref: "#/components/parameters/digital_twin"
        - $ref: "#/components/parameters/pdf-a"
        - $ref: "#/components/parameters/accept_language"
        - $ref: "#/components/parameters/prepare_scope"
        - $ref: "#/components/parameters/additional_page"
        - $ref: "#/components/parameters/qr_llx"
        - $ref: "#/components/parameters/qr_lly"
        - $ref: "#/components/parameters/qr_height"
        - $ref: "#/components/parameters/qr_page"
        - $ref: "#/components/parameters/encryption_key"
        - $ref: "#/components/parameters/password_encryption"
        - $ref: "#/components/parameters/placeholder"
      summary: Prepare a file for signing or certification
      requestBody:
        description: The file to prepare.
        required: true
        content:
          application/pdf: { }
      responses:
        200:
          description: The prepared file content.
          content:
            application/pdf:
              schema:
                type: string
        400:
          $ref: "#/components/responses/bad_request"
        401:
          $ref: "#/components/responses/unauthorized"
      tags:
        - Certification
        - Signing

  /sign:
    post:
      operationId: sign_file
      parameters:
        - $ref: "#/components/parameters/digital_twin"
        - $ref: "#/components/parameters/pdf-a"
        - $ref: "#/components/parameters/accept_language"
        - $ref: "#/components/parameters/additional_page"
        - $ref: "#/components/parameters/qr_llx"
        - $ref: "#/components/parameters/qr_lly"
        - $ref: "#/components/parameters/qr_height"
        - $ref: "#/components/parameters/qr_page"
        - $ref: "#/components/parameters/encryption_key"
        - $ref: "#/components/parameters/password_encryption"
        - name: hash
          in: query
          schema:
            type: string
        - name: note
          in: query
          schema:
            type: string
            maxLength: 255
        - name: legal-weight
          in: query
          schema:
            type: string
            enum:
              - AES
              - QES
              - SES
        - name: jurisdiction
          in: query
          schema:
            type: string
            enum:
              - eIDAS
              - ZertES
        - name: filename
          in: query
          schema:
            type: string
        - name: no-prepare
          in: query
          schema:
            type: boolean
        - name: position-x
          description: |
            The x-coordinate of the signature from the bottom-left of the page.
            This is required when `additional-page=false`.
          in: query
          schema:
            type: number
        - name: position-y
          description: |
            The y-coordinate of the signature from the bottom-left of the page.
            This is required when `additional-page=false`.
          in: query
          schema:
            type: number
        - name: height
          description: The height of the signature card. This is required when `additional-page=false`.
          in: query
          schema:
            type: number
        - name: page
          description: The page to place the signature on. This is required when `additional-page=false`.
          in: query
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/placeholder_id"
      summary: Sign a file
      requestBody:
        description: The file to sign.
        required: true
        content:
          application/pdf: { }
      responses:
        200:
          description: The signed file content.
          content:
            application/pdf:
              schema:
                type: string
        400:
          $ref: "#/components/responses/bad_request"
        401:
          $ref: "#/components/responses/unauthorized"
      tags:
        - Signing

  /revoke:
    post:
      operationId: revoke_document
      summary: Revoke a document
      requestBody:
        description: The document to revoke.
        required: true
        content:
          application/pdf: { }
      responses:
        200:
          description: The revocation was successful.
        400:
          $ref: "#/components/responses/bad_request"
        401:
          $ref: "#/components/responses/unauthorized"
      tags:
        - Certification

  /verify:
    post:
      operationId: verify_document
      summary: Verify a document
      description: |
        Verifies a document and returns detailed verification information including blockchain
        registration status, issuer details, signature events, and document authenticity.
      requestBody:
        description: The document to verify.
        required: true
        content:
          application/pdf: { }
      responses:
        200:
          description: The verification result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/verification_result"
        400:
          $ref: "#/components/responses/bad_request"
        404:
          description: No registration found with the given document hash.
        500:
          $ref: "#/components/responses/internal_server_error"
      security: [ ]
      tags:
        - Certification

  /register:
    post:
      operationId: register_file
      parameters:
        - $ref: "#/components/parameters/digital_twin"
        - $ref: "#/components/parameters/pdf-a"
        - $ref: "#/components/parameters/accept_language"
        - name: scope
          in: query
          schema:
            allOf:
              - $ref: "#/components/schemas/scope"
              - default: register
        - $ref: "#/components/parameters/additional_page"
        - $ref: "#/components/parameters/qr_llx"
        - $ref: "#/components/parameters/qr_lly"
        - $ref: "#/components/parameters/qr_height"
        - $ref: "#/components/parameters/qr_page"
        - $ref: "#/components/parameters/encryption_key"
        - $ref: "#/components/parameters/password_encryption"
        - name: hash
          in: query
          schema:
            type: string
        - name: note
          in: query
          schema:
            type: string
            maxLength: 255
        - name: legal-weight
          in: query
          schema:
            type: string
            enum:
              - AES
              - QES
              - SES
        - name: jurisdiction
          in: query
          schema:
            type: string
            enum:
              - eIDAS
              - ZertES
        - name: filename
          in: query
          schema:
            type: string
        - name: no-prepare
          in: query
          schema:
            type: boolean
        - name: position-x
          description: |
            The x-coordinate of the signature from the bottom-left of the page.
            This is required when `additional-page=false`.
          in: query
          schema:
            type: number
        - name: position-y
          description: |
            The y-coordinate of the signature from the bottom-left of the page.
            This is required when `additional-page=false`.
          in: query
          schema:
            type: number
        - name: height
          description: The height of the signature card. This is required when `additional-page=false`.
          in: query
          schema:
            type: number
        - name: page
          description: The page to place the signature on. This is required when `additional-page=false`.
          in: query
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/placeholder_id"
        - name: placeholder-id
          description: |
            ID of the signature placeholder field to use for signature positioning.
            If specified, position flags (position-x, position-y, height, page) are ignored.
          in: query
          schema:
            type: string
      summary: Register a file
      requestBody:
        description: The file to register.
        required: true
        content:
          application/pdf: { }
      responses:
        200:
          description: The registered file content. There is no response body if `scope` was `revoke`.
          content:
            application/pdf:
              schema:
                type: string
        400:
          $ref: "#/components/responses/bad_request"
        401:
          $ref: "#/components/responses/unauthorized"
      tags:
        - Certification

  /request/create:
    post:
      operationId: request_signature
      parameters:
        - $ref: "#/components/parameters/digital_twin"
        - $ref: "#/components/parameters/pdf-a"
        - name: send-email
          in: query
          schema:
            type: boolean
            default: false
          description: |
            If `send-email=true`, the server will send the signature request to the signer's email
            and also send reminder emails to get them to sign.
        - name: name
          in: query
          schema:
            type: string
            description: |
              The full name of the signer. You can omit this and send the name in parts using
              `first-name`, `middle-names`, and `last-name`.
        - name: first-name
          in: query
          schema:
            type: string
        - name: middle-names
          in: query
          schema:
            type: string
        - name: last-name
          in: query
          schema:
            type: string
        - name: email
          in: query
          schema:
            type: string
            format: email
          description: The signer's email address.
          required: true
        - name: mobile-phone
          in: query
          schema:
            type: string
        - name: citizenship
          in: query
          schema:
            type: string
        - name: birthday
          in: query
          schema:
            type: string
        - name: gender
          in: query
          schema:
            type: string
        - name: domicile
          in: query
          schema:
            type: string
        - name: webhook-url
          in: query
          schema:
            type: string
            format: url
        - $ref: "#/components/parameters/accept_language"
        - $ref: "#/components/parameters/additional_page"
        - $ref: "#/components/parameters/qr_llx"
        - $ref: "#/components/parameters/qr_lly"
        - $ref: "#/components/parameters/qr_height"
        - $ref: "#/components/parameters/qr_page"
        - $ref: "#/components/parameters/encryption_key"
        - $ref: "#/components/parameters/password_encryption"
        - name: with-password
          in: query
          schema:
            type: boolean
          description: |
            Protect the request using a password so that only the password bearer can sign.
            If enabled, a password will be generated. Send the password, together with the request URL, to the signer.
        - name: hash
          in: query
          schema:
            type: string
        - name: message
          in: query
          schema:
            type: string
            maxLength: 255
        - name: transaction-id
          in: query
          schema:
            type: string
        - name: auto-sign
          in: query
          schema:
            type: boolean
            default: false
        - name: legal-weight
          in: query
          schema:
            $ref: "#/components/schemas/legal_weight"
        - name: jurisdiction
          in: query
          schema:
            type: string
            enum:
              - eIDAS
              - ZertES
        - name: filename
          in: query
          schema:
            type: string
        - name: no-prepare
          in: query
          schema:
            type: boolean
        - name: position-x
          description: |
            The x-coordinate of the signature from the bottom-left of the page.
            This is required when `additional-page=false`.
          in: query
          schema:
            type: number
        - name: position-y
          description: |
            The y-coordinate of the signature from the bottom-left of the page.
            This is required when `additional-page=false`.
          in: query
          schema:
            type: number
        - name: height
          description: The height of the signature card. This is required when `additional-page=false`.
          in: query
          schema:
            type: number
        - name: page
          description: The page to place the signature on. This is required when `additional-page=false`.
          in: query
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/placeholder_id"
        - name: custom-password
          description: |
            Custom password for signature request. Automatically enables password protection.
            If neither this nor `with-password` is provided, no password is used.
          in: query
          schema:
            type: string
      summary: Request a signature
      requestBody:
        description: The files to sign
        required: true
        content:
          application/pdf: { }
          application/json:
            schema:
              properties:
                files:
                  type: array
                  items:
                    type: object
                    properties:
                      url:
                        type: string
                        format: url
                        description: |
                          DA URL of the documents to sign.
                      name:
                        type: string
                        description: |
                          Name of the document. This is used in the signature request email.
          application/x-www-form-urlencoded:
            schema:
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: url
                  description: |
                    DA URLs to the documents to sign. Previous signing links can be reused.
                    If a link to a password-protected request is provided, also pass the `password` parameter.
          multipart/form-data:
            schema:
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Upload PDF documents to sign.
            encoding:
              files:
                contentType: application/pdf
                style: form
      responses:
        200:
          description: The signature request was created.
          content:
            application/json:
              schema:
                properties:
                  request_url:
                    type: string
                    format: url
                  password:
                    type: string
        400:
          $ref: "#/components/responses/bad_request"
        401:
          $ref: "#/components/responses/unauthorized"
        409:
          description: The signer already has a pending signature request for the file.
      tags:
        - Signing

  /request/cancel:
    post:
      operationId: cancel_request
      summary: Cancel signature request for signer
      parameters:
        - name: email
          in: query
          schema:
            type: string
            format: email
          description: The email of the signer to cancel the request for.
          required: true
        - name: note
          in: query
          schema:
            type: string
          description: A message to the signer. You can use this to explain why you cancelled the request.
      requestBody:
        description: A file used in the signature request.
        required: true
        content:
          application/pdf: { }
      responses:
        204:
          description: The signature request to the given signer was cancelled.
        400:
          description: |
            Check that:
            1. The `email` parameter was provided.
            2. The file provided has been prepared and can be read.
        401:
          $ref: "#/components/responses/unauthorized"
        403:
          description: You cannot cancel the request at this time. It could be because the signer has signed already.
        404:
          description: Either the file provided or the signer email was not found.
      tags:
        - Signing

  /request/cancel/all:
    post:
      operationId: cancel_request_all
      summary: Cancel signature requests for file
      parameters:
        - name: note
          in: query
          schema:
            type: string
          description: A message to the signers. You can use this to explain why you cancelled the request.
      requestBody:
        description: A file used in the signature request.
        required: true
        content:
          application/pdf: { }
      responses:
        204:
          description: All pending signature requests for the file were cancelled.
        400:
          description: Check that the file provided has been prepared and can be read.
        401:
          $ref: "#/components/responses/unauthorized"
        403:
          description: You cannot cancel the requests at this time. It could be because a signer has signed already.
        404:
          description: The file provided was not found. Check that the file was processed and that you used it in a signature request.
      tags:
        - Signing

  /request/list:
    post:
      deprecated: true
      operationId: list_requests
      summary: List signature requests for file
      requestBody:
        description: A file (or a file URL) used in the signature request.
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              properties:
                file:
                  type: string
                  format: url
                password:
                  type: string
              required:
                - file
          multipart/form-data:
            schema:
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
            encoding:
              file:
                contentType: application/pdf
      responses:
        200:
          description: List of signature requests for the file.
          content:
            application/json:
              schema:
                properties:
                  id:
                    type: string
                  legal_weight:
                    $ref: "#/components/schemas/legal_weight"
                  cancelled:
                    type: boolean
                  signed:
                    type: boolean
                  signer:
                    $ref: "#/components/schemas/user"
                  requester:
                    $ref: "#/components/schemas/user"
        400:
          description: Check that the file provided has been prepared and can be read.
        401:
          $ref: "#/components/responses/unauthorized"
        403:
          description: You cannot list signature requests for this file.
        404:
          description: The file provided was not found. Check that the file was processed and that you used it in a signature request.
      tags:
        - Signing

  /request/status:
    get:
      operationId: request_status
      summary: Show status of signature request
      parameters:
        - name: request_url
          in: query
          required: true
          schema:
            type: string
            format: url
          description: The URL of the signature request to check.
        - name: password
          in: query
          schema:
            type: string
          description: Password for password encrypted requests
      responses:
        200:
          description: Status of the signature request.
          content:
            application/json:
              schema:
                properties:
                  url:
                    type: string
                    format: url
                  id:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  cancelled:
                    type: boolean
                  envelope_items:
                    type: object
                    properties:
                      legal_weight:
                        $ref: "#/components/schemas/legal_weight"
                      jurisdiction:
                        type: string
                      status:
                        $ref: "#/components/schemas/envelope_item_status"
                      signed_at:
                        type: string
                        format: date-time
                      file_url:
                        type: string
                        format: url
                      file_id:
                        type: string
                  signer:
                    type: object
                    properties:
                      email:
                        type: string
                        format: email
                  used_identification_at:
                    type: string
                    format: date-time
                  identification_method:
                    type: string
        400:
          description: Check that the file provided has been prepared and can be read.
        401:
          $ref: "#/components/responses/unauthorized"
        403:
          description: You cannot list signature requests for this file.
        404:
          description: The file provided was not found. Check that the file was processed and that you used it in a signature request.
      tags:
        - Signing

  /request/file/status:
    get:
      operationId: file_requests_status
      summary: Show status of signature requests of given file
      parameters:
        - name: file_url
          in: query
          required: true
          schema:
            type: string
            format: url
          description: The DA URL of the file to check.
        - name: password
          in: query
          schema:
            type: string
          description: Password for password encrypted document.
      responses:
        200:
          description: File status across all signature requests.
          content:
            application/json:
              schema:
                properties:
                  file_url:
                    type: string
                    format: url
                  file_id:
                    type: string
                  signature_requests:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                        cancelled:
                          type: boolean
                        envelope_items:
                          type: object
                          properties:
                            legal_weight:
                              $ref: "#/components/schemas/legal_weight"
                            jurisdiction:
                              type: string
                            status:
                              $ref: "#/components/schemas/envelope_item_status"
                            signed_at:
                              type: string
                              format: date-time
                            file_url:
                              type: string
                              format: url
                            file_id:
                              type: string
                        signer:
                          type: object
                          properties:
                            email:
                              type: string
                              format: email
                        used_identification_at:
                          type: string
                          format: date-time
                        identification_method:
                          type: string
        400:
          description: Check that the file provided has been prepared and can be read.
        401:
          $ref: "#/components/responses/unauthorized"
        403:
          description: You cannot list signature requests for this file.
        404:
          description: The file provided was not found. Check that the file was processed and that you used it in a signature request.
      tags:
        - Signing

  /qes/check:
    post:
      summary: Check account QES status
      requestBody:
        content:
          application/json:
            schema:
              properties:
                jurisdiction:
                  type: string
              required:
                - jurisdiction
      responses:
        200:
          description: QES is enabled for your account.
        400:
          $ref: "#/components/responses/bad_request"
        401:
          $ref: "#/components/responses/unauthorized"
        404:
          description: QES is disabled for your account.
      tags:
        - Account
        - Signing

  /user:
    get:
      operationId: get_user
      summary: Get account data
      responses:
        200:
          description: The user data for your account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/user"
        401:
          $ref: "#/components/responses/unauthorized"
      tags:
        - Account

  /request/file/add:
    post:
      operationId: add_files
      summary: Add new files to signature requests
      description: |
        Add documents to a signature request, provided the signing is incomplete. The signing URL is required for this.
        You can add a single document by uploading the PDF, with the filename as a query parameter.
        To add multiple documents, submit a JSON body with the file URLs and names.
        If the document has not been prepared yet, it will be prepared automatically. Use `no-prepare` to disable this.
        The legal weight and the jurisdiction will be the same as in the signature request.
      parameters:
        - name: filename
          in: query
          schema:
            type: string
          description: The name of the file. This is required when adding a single file as a PDF upload.
        - name: password
          in: query
          schema:
            type: string
          description: The password for the signature request, if it was password-protected.
        - name: request-url
          in: query
          required: true
          schema:
            type: string
            format: uri
          description: |
            The complete signing URL for the signature request, including the `#` fragment containing the encryption key.
        - $ref: "#/components/parameters/digital_twin"
        - $ref: "#/components/parameters/pdf-a"
        - $ref: "#/components/parameters/additional_page"
        - $ref: "#/components/parameters/accept_language"
        - name: no-prepare
          in: query
          schema:
            type: boolean
            default: false
          description: Do not prepare the document if it is not already prepared and return an error instead.
      requestBody:
        description: New files to be added to the signature request.
        required: true
        content:
          application/json:
            schema:
              properties:
                files:
                  type: array
                  items:
                    properties:
                      name:
                        type: string
                      url:
                        type: string
                        format: url
                    required:
                      - name
                      - url
          application/pdf: { }
      responses:
        200:
          description: The documents were added successfully.
        400:
          description: Check that the documents provided have been prepared and can be read, and that every required information was provided.
      tags:
        - Signing

  /signing-process/create:
    post:
      operationId: create_signing_process
      summary: Create a signing process
      description: |
        Creates a signing process, optionally with signature requests.
        When `signers` is provided, signature requests are created within the new process.
        Each signer's envelope items can carry `signature_positions` to place the
        signatures on the documents (see the `envelope_item_input` schema).
      requestBody:
        required: true
        description: JSON body with the signing process details.
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                is_individual:
                  type: boolean
                  default: false
                send_email:
                  type: boolean
                  default: false
                signers:
                  type: array
                  description: Optional list of signers with envelope items.
                  items:
                    $ref: "#/components/schemas/signer"
                signature_card_template:
                  type: string
                  description: Custom signature card template (JSON string).
                reason:
                  type: string
                  description: Reason for the signature request.
              required:
                - name
      responses:
        201:
          description: The signing process was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/signing_process"
        400:
          $ref: "#/components/responses/bad_request"
        401:
          $ref: "#/components/responses/unauthorized"
      tags:
        - Signing Processes

  /signing-process/list:
    get:
      operationId: list_signing_processes
      summary: List signing processes
      description: Lists all signing processes for the authenticated user.
      parameters:
        - name: page
          description: Page number.
          in: query
          schema:
            type: integer
        - name: size
          description: Number of items per page.
          in: query
          schema:
            type: integer
        - name: sort
          description: Field to sort by (e.g. name, created_at, status).
          in: query
          schema:
            type: string
        - name: order
          description: Sort direction (asc or desc).
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        200:
          description: A paginated list of signing processes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/signing_process_list"
        401:
          $ref: "#/components/responses/unauthorized"
      tags:
        - Signing Processes

  /signing-process/{id}:
    get:
      operationId: get_signing_process
      summary: Get a signing process by ID
      description: Retrieves details of a specific signing process.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: The signing process details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/signing_process"
        400:
          $ref: "#/components/responses/bad_request"
        401:
          $ref: "#/components/responses/unauthorized"
      tags:
        - Signing Processes

  /signing-process/{id}/cancel:
    post:
      operationId: cancel_signing_process
      summary: Cancel a signing process
      description: Cancels a signing process by its ID. An optional note can be provided to inform signers of the reason for cancellation.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  description: A message to the signers explaining why the process was cancelled.
      responses:
        200:
          description: The signing process was cancelled.
        400:
          $ref: "#/components/responses/bad_request"
        401:
          $ref: "#/components/responses/unauthorized"
      tags:
        - Signing Processes

  /org/process-reminder:
    get:
      operationId: get_org_process_reminder
      summary: Get the organisation-level signing-process reminder
      description: |
        Returns the parsed value of the `organization.signingprocess.reminder` setting
        for the caller's organisation. Returns an empty object (`{}`) when the
        setting is undefined (no row, empty value, or malformed JSON upstream).

        The caller must belong to exactly one organisation; otherwise the request
        is rejected with 400.
      responses:
        200:
          description: The parsed setting value, or `{}` when undefined.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/org_reminder"
        400:
          description: The caller does not belong to a single resolvable organisation.
        401:
          $ref: "#/components/responses/unauthorized"
        500:
          description: The upstream API could not be reached.
      tags:
        - Organization

    post:
      operationId: set_org_process_reminder
      summary: Set the organisation-level signing-process reminder
      description: |
        Upserts the `organization.signingprocess.reminder` setting on the caller's
        organisation. The CLI marshals the query parameters into the JSON shape
        the upstream `/setting/:entity_id` endpoint expects.

        Only an organisation administrator may write this setting. Once
        `enforced=true` (the default), the upstream API also bulk-updates every
        existing template in the organisation that already has reminders, in the
        same database transaction as the setting write.

        Omitting `message` preserves each template's existing message during the
        bulk sync (`COALESCE` upstream). Sending `message=` (empty string)
        deliberately blanks every template's message.
      parameters:
        - name: interval
          description: Reminder cadence in days (1-14).
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 14
        - name: max
          description: Maximum number of reminders (1-5).
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5
        - name: message
          description: |
            Reminder message body (max 500 characters). Omit to preserve per-template
            messages; send an empty value to blank them.
          in: query
          schema:
            type: string
            maxLength: 500
        - name: enforced
          description: |
            Whether the org reminder overrides per-request and per-template values.
            Defaults to `true`. Pass `false` to mark the setting dormant without
            deleting it.
          in: query
          schema:
            type: boolean
            default: true
      responses:
        200:
          description: The setting was upserted successfully.
        400:
          description: A query parameter could not be parsed or the caller does not belong to a single resolvable organisation.
        401:
          $ref: "#/components/responses/unauthorized"
        403:
          description: The caller is not an administrator of the target organisation.
        500:
          description: The upstream API could not be reached or the bulk template sync failed (in which case the setting write is rolled back upstream).
      tags:
        - Organization

  /identity/create:
    post:
      operationId: create_identity
      summary: Starts Identification process
      requestBody:
        description: The identity to create.
        required: true
        content:
          application/json:
            schema:
              properties:
                email:
                  type: string
                  format: email
                  description: The email address of the user.
                first_name:
                  type: string
                  example: Max
                  description: The first name of the user.
                last_name:
                  type: string
                  example: Muster
                  description: The last name of the user.
                phone_number:
                  type: string
                  example: "+41794442211"
                  description: The phone number of the user in E.164 format (e.g. +41794442211).
                  pattern: '^\+[1-9]\d{1,14}$'
                document_type:
                  type: string
                  description: The type of document to use for identification.
                  enum:
                    - passport
                    - id_card
                jurisdiction:
