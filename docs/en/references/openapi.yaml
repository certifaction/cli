                  description: Jurisdiction where identity should be valid.
                  enum:
                    - ZertES
                    - eIDAS
      responses:
        200:
          content:
            "application/json":
              schema:
                properties:
                  id:
                    type: string
                    example: 2NxZlu7vlji
                    description: The ID of the identity.
                  identification_url:
                    type: string
                    example: https://identifcation.example.com/some_ident_id
                    description: Url to perform identification.
        400:
          description: The request is not properly formed. For example, the content could not be read.
        401:
          description: You are not authorized to carry out the operation.
