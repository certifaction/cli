openapi: "3.0.2"

info:
  title: API Locale Certifaction
  description: |
    Un server proxy per l'integrazione con la piattaforma Certifaction.

    ## Requisiti di configurazione

    1. L'autenticazione è richiesta per eseguire alcune operazioni. Si prega di fare riferimento alla sezione [Autenticazione](https://developers.certifaction.com/it/references/authentication) per ottenere una chiave API o un token.
    2. Avviare il server locale sulla CLI utilizzando il comando `certifaction server`

    Consulti la [nostra guida di configurazione](https://developers.certifaction.com/it/guides/getting-started-api#getting-started-with-the-local-api) per iniziare.

  version: ""

servers:
  - url: http://localhost:{port}
    variables:
      port:
        default: "8081"

security:
  - api_key: [ ]

tags:
  - name: Signing
    description: Firmare file e richiedere firme
  - name: Documents
    description: Scaricare i propri documenti o rimuovere l'accesso di Certifaction ad essi
  - name: Account
    description: Accedere ai dati del proprio account utente
  - name: Signing Processes
    description: Creare e gestire processi di firma
  - name: Organization
    description: Gestire le impostazioni a livello di organizzazione
  - name: Server
    description: Controllare lo stato del server
  - name: Certification
    description: Certificazione blockchain

components:
  parameters:
    additional_page:
      name: additional-page
      description: Se posizionare Digital Twin e firme su una pagina aggiuntiva o inline.
      in: query
      schema:
        type: boolean
        default: true
    digital_twin:
      name: digital-twin
      description: Abilitare [Digital Twin](https://certifaction.com/digital-twin/) per il documento.
      in: query
      schema:
        type: boolean
        default: false
    pdf-a:
      name: pdf-a
      description: Abilitare la compatibilità PDF/A
      in: query
      schema:
        type: boolean
        default: false
    accept_language:
      name: Accept-Language
      description: |
        La lingua per gli oggetti di testo aggiunti al documento. Inserire `de` per il tedesco, `en` per l'inglese,
        `fr` per il francese, o `it` per l'italiano.
      in: header
      schema:
        $ref: "#/components/schemas/language"
    prepare_scope:
      name: scope
      in: query
      schema:
        $ref: "#/components/schemas/prepare_scope"
      required: true
    qr_llx:
      name: qr-llx
      description: |
        La coordinata x del codice QR Digital Twin dall'angolo inferiore sinistro del documento.
        Questo è richiesto quando `additional-page=false`.
      in: query
      schema:
        type: number
    qr_lly:
      name: qr-lly
      description: |
        La coordinata y del codice QR Digital Twin dall'angolo inferiore sinistro del documento.
        Questo è richiesto quando `additional-page=false`.
      in: query
      schema:
        type: number
    qr_height:
      name: qr-height
      description: L'altezza del codice QR Digital Twin. Questo è richiesto quando `additional-page=false`.
      in: query
      schema:
        type: number
    qr_page:
      name: qr-page
      description: La pagina su cui posizionare il codice QR Digital Twin. Questo è richiesto quando `additional-page=false`.
      in: query
      schema:
        type: integer
    encryption_key:
      name: encryption-key
      description: Una stringa esadecimale per crittografare il documento.
      in: query
      schema:
        type: string
    password_encryption:
      name: password-encryption
      description: L'algoritmo di crittografia password da utilizzare per crittografare la chiave di crittografia.
      in: query
      schema:
        type: string
        enum:
          - xor-b58
    placeholder:
      name: placeholder
      description: |
        Abilita la modalità segnaposto per rilevare ed elaborare i segnaposto di firma nel documento PDF.

        Quando abilitato, l'endpoint prepare:
        - Rileverà i segnaposto di testo `##SIG{...}` nel documento
        - Memorizzerà le loro posizioni per il posizionamento successivo della firma
        - Rimuoverà il testo del segnaposto dal documento

        ## Formato del Segnaposto di Testo

        Aggiungi segnaposto di testo direttamente nel tuo documento PDF utilizzando questo formato basato su JSON:

        ```
        ##SIG{"id":"signer1","w":"9cm","x":"2cm","y":"1cm"}
        ```

        ### Descrizione dei Campi

        - **id** (obbligatorio): Il nome/identificatore del campo per il segnaposto di firma
          - Nota: `role` può essere utilizzato al posto di `id` per retrocompatibilità
        - **w** (opzionale): Larghezza del riquadro della firma
          - Unità supportate: `cm`, `mm`, `in`, `pt`
          - Se specificato, l'altezza viene calcolata automaticamente per mantenere le proporzioni
          - Esempi: `"w":"9cm"`, `"w":"100pt"`, `"w":"2in"`
        - **h** (opzionale): Altezza del riquadro della firma
          - Unità supportate: `cm`, `mm`, `in`, `pt`
          - Utilizzato solo se la larghezza (`w`) non è specificata
          - Esempi: `"h":"3cm"`
        - **x** (opzionale): Offset orizzontale dalla posizione del testo
          - Unità supportate: `cm`, `mm`, `in`, `pt`
          - I valori positivi spostano la firma verso destra
          - Esempi: `"x":"2cm"`
        - **y** (opzionale): Offset verticale dalla posizione del testo
          - Unità supportate: `cm`, `mm`, `in`, `pt`
          - I valori positivi spostano la firma verso il basso
          - Esempi: `"y":"1cm"`

        ### Esempi

        ```
        ##SIG{"id":"manager","w":"8cm"}
        ##SIG{"id":"director","w":"100pt","x":"1cm","y":"0.5cm"}
        ##SIG{"id":"witness","h":"2cm","x":"3cm"}
        ```

        ### Note

        - Se né `w` né `h` sono specificati, la firma utilizza la larghezza di base predefinita
        - La larghezza (`w`) ha la precedenza sull'altezza (`h`) per mantenere le proporzioni corrette
        - Gli offset di posizione (`x`, `y`) sono relativi al punto in cui appare il testo `##SIG{...}` nel documento
      in: query
      schema:
        type: boolean
        default: false
    placeholder_id:
      name: placeholder-id
      description: |
        ID del campo segnaposto di firma da utilizzare per il posizionamento della firma.
        Se specificato, la firma sarà posizionata nella posizione del segnaposto con questo ID.

        Questo parametro fa riferimento al campo `id` in un segnaposto `##SIG{...}` (ad esempio, per `##SIG{"id":"manager"}`, utilizzare `placeholder-id=manager`).

        Quando si utilizza questo parametro, i flag relativi alla posizione (position-x, position-y, height, page) vengono ignorati.
      in: query
      schema:
        type: string

  responses:
    bad_request:
      description: La richiesta non è formattata correttamente. Ad esempio, il contenuto non può essere letto.
    unauthorized:
      description: Non è autorizzato a eseguire l'operazione. Verifichi che la Sua chiave API sia corretta.
    forbidden:
      description: Non ha il permesso di eseguire l'operazione. Ad esempio potrebbe non avere il ruolo richiesto.
    not_found:
      description: La risorsa richiesta non è stata trovata.
    conflict:
      description: Conflitto rilevato nella richiesta. Ad esempio, un utente potrebbe essere già stato aggiunto a un'organizzazione.
    internal_server_error:
      description: Si è verificato un errore sul server

  securitySchemes:
    api_key:
      name: Authorization
      in: header
      type: apiKey

  schemas:
    envelope_item_status:
      type: string
      enum:
        - unsigned
        - awaiting_upload
        - signed
        - cancelled

    language:
      type: string
      enum:
        - de
        - en
        - fr
        - it

    legal_weight:
      type: string
      enum:
        - AES
        - QES
        - SES

    scope:
      type: string
      enum:
        - register
        - sign
        - certify
        - revoke
        - retract
    prepare_scope:
      type: string
      enum:
        - sign
        - certify
        - attachment

    identity:
      properties:
        uid:
          type: string
        user_uid:
          type: string
        issuer:
          type: string
        status:
          type: string
        verification_url:
          type: string
        verification_id:
          type: string
        evidence_url:
          type: string
        proof:
          type: string
        name:
          type: string
        given_name:
          type: string
        family_name:
          type: string
        birthday:
          type: string
        signature_level:
          type: string
        signature_jurisdiction:
          type: string
      required:
        - uid
        - user_uid
        - issuer
        - status
        - verification_url
        - verification_id
        - evidence_url
        - proof
        - name
        - given_name
        - family_name
        - birthday

    organization:
      properties:
        id:
          type: string
        name:
          type: string
          maxLength: 80
          minLength: 2
        subscription_type:
          type: string
        quota:
          type: integer
      required:
        - id

    user:
      properties:
        id:
          type: integer
        uid:
          type: string
        external_id:
          type: string
        email:
          type: string
        title:
          type: string
        name:
          type: string
        first_name:
          type: string
        middle_names:
          type: string
        last_name:
          type: string
        affiliation:
          type: string
        address:
          type: string
        postalcode:
          type: string
        location:
          type: string
        eth_address:
          type: string
        quota:
          type: integer
        disabled:
          type: boolean
        file_suffix:
          type: string
        permissions:
          type: array
          items:
            type: string
        subscription_type:
          type: string
        encrypt_claims:
          type: boolean
        verified_by:
          type: string
        features:
          type: object
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/organization"
        identities:
          type: array
          items:
            $ref: "#/components/schemas/identity"
        theme:
          properties:
            name:
              type: string
          required:
            - name
        name_verified:
          type: boolean

    verified_by:
      properties:
        name:
          type: string
        image:
          type: string

    verification_issuer:
      properties:
        id:
          type: string
        title:
          type: string
        name:
          type: string
        email:
          type: string
        verified:
          type: boolean
        verified_by:
          $ref: "#/components/schemas/verified_by"

    blockchain_entry:
      properties:
        type:
          type: string
        contract_address:
          type: string
        tx_hash:
          type: string
        date:
          type: string
          format: date-time

    verification_signature:
      properties:
        jurisdiction:
          type: string
        level:
          type: string
        pkcs7_data:
          type: string

    verification_event:
      properties:
        ref:
          type: string
        encrypted:
          type: boolean
        issuer:
          $ref: "#/components/schemas/verification_issuer"
        scope:
          type: string
        note:
          type: string
        signature:
          $ref: "#/components/schemas/verification_signature"
        date:
          type: string
          format: date-time
        on_blockchain:
          $ref: "#/components/schemas/blockchain_entry"

    verification_file_info:
      properties:
        hash:
          type: string
        status:
          type: string
          enum:
            - registering
            - registered
            - revoking
            - revoked

    verification_result:
      properties:
        verified:
          type: boolean
          description: Se il file è verificato
        authentic:
          type: boolean
          description: Se il file è autentico
        on_blockchain:
          type: boolean
          description: Se il file è sulla blockchain
        encrypted:
          type: boolean
          description: Se il file è crittografato
        revoked:
          type: boolean
          description: Se il file è stato revocato
        file:
          $ref: "#/components/schemas/verification_file_info"
        events:
          type: array
          items:
            $ref: "#/components/schemas/verification_event"
        claims:
          type: array
          items:
            type: object
        issuer_name:
          type: string
          deprecated: true
          description: "Obsoleto: utilizzare events.issuer invece"
        issuer_verifiedby:
          type: string
          deprecated: true
          description: "Obsoleto: utilizzare events.issuer invece"
        issuer_img:
          type: string
          deprecated: true
          description: "Obsoleto: utilizzare events.issuer invece"
        issuer_address:
          type: string
          deprecated: true
          description: "Obsoleto: utilizzare events.issuer invece"
        issuer_verified:
          type: boolean
          deprecated: true
          description: "Obsoleto: utilizzare events.issuer invece"
        issuer_title:
          type: string
          deprecated: true
          description: "Obsoleto: utilizzare events.issuer invece"

    signer:
      type: object
      properties:
        email:
          type: string
        name:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        language:
          type: string
        message:
          type: string
        sign_order:
          type: integer
        participation_role:
          type: string
          enum: ["signer", "approver", "observer"]
        webhook_url:
          type: string
          format: url
          description: URL per ricevere notifiche webhook sulle modifiche dello stato della richiesta di firma di questo firmatario.
        envelope_items:
          type: array
          items:
            $ref: "#/components/schemas/envelope_item_input"

    envelope_item_input:
      type: object
      properties:
        link:
          type: string
          description: Link dell'archivio digitale per il documento.
        file_id:
          type: string
          description: ID del file (derivato dal link se non fornito).
        document_id:
          type: string
          description: ID del documento (derivato dal link se non fornito).
        filename:
          type: string
        legal_weight:
          $ref: "#/components/schemas/legal_weight"
        jurisdiction:
          type: string
          enum: ["ZertES", "eIDAS"]
        signature_position:
          type: string
          deprecated: true
          description: "Obsoleto: utilizzare `signature_positions` invece."
        signature_positions:
          type: array
          description: Posizioni di firma strutturate da inserire su questo documento.
          items:
            $ref: "#/components/schemas/signature_position_input"

    envelope_item:
      type: object
      properties:
        link:
          type: string
          description: Link dell'archivio digitale per il documento.
        file_id:
          type: string
          description: ID del file (derivato dal link se non fornito).
        document_id:
          type: string
          description: ID del documento (derivato dal link se non fornito).
        filename:
          type: string
        legal_weight:
          $ref: "#/components/schemas/legal_weight"
        jurisdiction:
          type: string
          enum: ["ZertES", "eIDAS"]
        signature_position:
          type: string
          deprecated: true
          description: "Obsoleto: utilizzare `signature_positions` invece."
        signature_positions:
          type: array
          description: Posizioni di firma per questo documento, nella rappresentazione dell'API.
          items:
            $ref: "#/components/schemas/signature_position_output"
        status:
          type: string
          description: Stato dell'elemento envelope (presente nelle risposte).
          readOnly: true
          enum: ["unsigned", "awaiting_approval", "awaiting_upload", "signed", "approved", "declined", "declined_confirmed", "cancelled", "attachment", "for_observation"]
        signed_at:
          type: string
          format: date-time

    signature_position_input:
      type: object
      description: |
        Una posizione di firma strutturata. Le coordinate sono in unità assolute dello spazio
        utente del PDF, o frazioni delle dimensioni della pagina quando `positioning` è "relative".
        Le posizioni di firma sono supportate solo per le firme SES.
      properties:
        pageNo:
          type: integer
          description: Numero di pagina per il posizionamento della firma (a partire da 1).
        llx:
          type: number
          description: Coordinata X dell'angolo inferiore sinistro.
        lly:
          type: number
          description: Coordinata Y dell'angolo inferiore sinistro.
        height:
          type: number
          description: Altezza del campo firma.
        rotate:
          type: integer
          description: Angolo di rotazione in gradi (0, 90, 180, 270).
        positioning:
          type: string
          enum: ["", "relative", "placeholder"]
          description: '"relative" per il posizionamento relativo, vuoto per quello assoluto.'
        placeholder:
          type: string
          description: ID di un campo segnaposto di firma nel documento, utilizzato con `positioning=placeholder`.
        legalWeight:
          type: string
          description: Valore legale - supportato solo SES.
        jurisdiction:
          type: string
          enum: ["eIDAS", "ZertES"]
          description: Giurisdizione legale.

    signature_position_output:
      type: object
      description: Una posizione di firma come restituita dall'API.
      properties:
        position:
          type: string
          description: La posizione, codificata come stringa JSON.
        legal_weight:
          type: string
        jurisdiction:
          type: string
          enum: ["eIDAS", "ZertES"]
        status:
          type: string
        sign_order:
          type: integer

    signature_request_response:
      type: object
      properties:
        id:
          type: string
        signing_process_id:
          type: string
        legal_weight:
          $ref: "#/components/schemas/legal_weight"
        jurisdiction:
          type: string
          enum: ["ZertES", "eIDAS"]
        cancelled:
          type: boolean
        signed:
          type: boolean
        signer:
          $ref: "#/components/schemas/user"
        requester:
          $ref: "#/components/schemas/user"
        envelope_items:
          type: array
          items:
            $ref: "#/components/schemas/envelope_item"
        used_identification_at:
          type: string
          format: date-time
        identification_method:
          type: string
        created_at:
          type: string
          format: date-time

    signing_process:
      properties:
        process_id:
          type: string
        name:
          type: string
        owner_uid:
          type: string
        created_at:
          type: string
          format: date-time
        status:
          type: string
        tag_ids:
          type: array
          items:
            type: string
        is_individual:
          type: boolean
        total:
          type: integer
          description: Numero totale di documenti nel processo di firma.
        signed:
          type: integer
          description: Numero di documenti che sono stati firmati nel processo di firma.
        cancelled:
          type: integer
          description: Numero di documenti che sono stati annullati nel processo di firma.
        signature_requests:
          type: array
          items:
            $ref: "#/components/schemas/signature_request_response"

    signing_process_list:
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/signing_process"
        total_pages:
          type: integer
        total_elements:
          type: integer
        page:
          type: integer

    org_reminder:
      type: object
      description: |
        Impostazione del promemoria del processo di firma a livello di organizzazione
        (`organization.signingprocess.reminder`).

        Quando `enforced` è true, la cadenza e il messaggio sovrascrivono i valori di promemoria
        per singola richiesta e per modello per ogni processo di firma nell'organizzazione, e
        l'API upstream sincronizza i modelli esistenti che hanno già promemoria affinché
        corrispondano. Quando `enforced` è false l'impostazione è inattiva e hanno effetto i
        valori per singola richiesta / per modello.

        `message` ha tre stati: omettere il campo per preservare il messaggio esistente di
        ciascun modello durante la sincronizzazione di massa, inviare una stringa vuota
        esplicita per azzerare deliberatamente il messaggio di ogni modello, o inviare una
        stringa non vuota per sovrascrivere.
      properties:
        enforced:
          type: boolean
          description: Se la policy dell'organizzazione sovrascrive i valori di promemoria per singola richiesta e per modello.
        intervals:
          type: integer
          minimum: 1
          maximum: 14
          description: Cadenza del promemoria in giorni.
        max:
          type: integer
          minimum: 1
          maximum: 5
          description: Numero massimo di promemoria da inviare.
        message:
          type: string
          maxLength: 500
          description: Corpo del messaggio di promemoria. Omettere per preservare i messaggi per modello esistenti; inviare `""` per azzerarli.

paths:
  /delete-access:
    post:
      operationId: remove_access
      summary: Rimuovere l'accesso di Certifaction a un file
      requestBody:
        description: Il file per cui si desidera rimuovere l'accesso di Certifaction.
        required: true
        content:
          application/pdf: { }
      responses:
        200:
          description: L'accesso al file è stato rimosso con successo.
        400:
          $ref: "#/components/responses/bad_request"
        401:
          $ref: "#/components/responses/unauthorized"
      tags:
        - Documents

  /download:
    get:
      summary: Scaricare file
      parameters:
        - name: file
          description: Un URL del Digital Archive
          in: query
          required: true
          schema:
            type: string
            format: url
        - name: password
          description: La password della richiesta di firma, se Privacy 2.0 era abilitato
          in: query
          schema:
            type: string
      operationId: download_file
      responses:
        200:
          description: Contenuto del download del file.
          content:
            application/pdf:
              schema:
                type: string
            application/zip:
              schema:
                type: string
        400:
          $ref: "#/components/responses/bad_request"
        401:
          $ref: "#/components/responses/unauthorized"
      security: [ ]
      tags:
        - Documents

  /health:
    get:
      operationId: server_health_check
      summary: Controllare lo stato del server
      responses:
        200:
          description: Risposta di controllo dello stato.
          content:
            application/json:
              schema:
                properties:
                  description:
                    type: string
                  service_name:
                    type: string
                  status:
                    type: string
      security: [ ]
      tags:
        - Server

  /ping:
    get:
      summary: Controllare che il server API sia in funzione
      responses:
        200:
          description: Il server è attivo e funzionante.
          content:
            text/plain:
              schema:
                type: string
                enum:
                  - pong
      security: [ ]
      tags:
        - Server

  /prepare:
    post:
      operationId: prepare_file
      parameters:
        - $ref: "#/components/parameters/digital_twin"
        - $ref: "#/components/parameters/pdf-a"
        - $ref: "#/components/parameters/accept_language"
        - $ref: "#/components/parameters/prepare_scope"
        - $ref: "#/components/parameters/additional_page"
        - $ref: "#/components/parameters/qr_llx"
        - $ref: "#/components/parameters/qr_lly"
        - $ref: "#/components/parameters/qr_height"
        - $ref: "#/components/parameters/qr_page"
        - $ref: "#/components/parameters/encryption_key"
        - $ref: "#/components/parameters/password_encryption"
        - $ref: "#/components/parameters/placeholder"
      summary: Preparare un file per la firma o certificazione
      requestBody:
        description: Il file da preparare.
        required: true
        content:
          application/pdf: { }
      responses:
        200:
          description: Il contenuto del file preparato.
          content:
            application/pdf:
              schema:
                type: string
        400:
          $ref: "#/components/responses/bad_request"
        401:
          $ref: "#/components/responses/unauthorized"
      tags:
        - Certification
        - Signing

  /sign:
    post:
      operationId: sign_file
      parameters:
        - $ref: "#/components/parameters/digital_twin"
        - $ref: "#/components/parameters/pdf-a"
        - $ref: "#/components/parameters/accept_language"
        - $ref: "#/components/parameters/additional_page"
        - $ref: "#/components/parameters/qr_llx"
        - $ref: "#/components/parameters/qr_lly"
        - $ref: "#/components/parameters/qr_height"
        - $ref: "#/components/parameters/qr_page"
