        - $ref: "#/components/parameters/qr_lly"
        - $ref: "#/components/parameters/qr_height"
        - $ref: "#/components/parameters/qr_page"
        - $ref: "#/components/parameters/encryption_key"
        - $ref: "#/components/parameters/password_encryption"
        - name: with-password
          in: query
          schema:
            type: boolean
          description: |
            Proteggere la richiesta usando una password in modo che solo il portatore della password possa firmare.
            Se abilitato, verrà generata una password. Invii la password, insieme all'URL della richiesta, al firmatario.
        - name: hash
          in: query
          schema:
            type: string
        - name: message
          in: query
          schema:
            type: string
            maxLength: 255
        - name: transaction-id
          in: query
          schema:
            type: string
        - name: auto-sign
          in: query
          schema:
            type: boolean
            default: false
        - name: legal-weight
          in: query
          schema:
            $ref: "#/components/schemas/legal_weight"
        - name: jurisdiction
          in: query
          schema:
            type: string
            enum:
              - eIDAS
              - ZertES
        - name: filename
          in: query
          schema:
            type: string
        - name: no-prepare
          in: query
          schema:
            type: boolean
        - name: position-x
          description: |
            La coordinata x della firma dal basso-sinistra della pagina.
            Questo è richiesto quando `additional-page=false`.
          in: query
          schema:
            type: number
        - name: position-y
          description: |
            La coordinata y della firma dal basso-sinistra della pagina.
            Questo è richiesto quando `additional-page=false`.
          in: query
          schema:
            type: number
        - name: height
          description: L'altezza della scheda firma. Questo è richiesto quando `additional-page=false`.
          in: query
          schema:
            type: number
        - name: page
          description: La pagina su cui posizionare la firma. Questo è richiesto quando `additional-page=false`.
          in: query
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/placeholder_id"
        - name: custom-password
          description: |
            Password personalizzata per la richiesta di firma. Abilita automaticamente la protezione con password.
            Se né questo né `with-password` viene fornito, non viene utilizzata alcuna password.
          in: query
          schema:
            type: string
      summary: Richiedere una firma
      requestBody:
        description: I file da firmare
        required: true
        content:
          application/pdf: { }
          application/json:
            schema:
              properties:
                files:
                  type: array
                  items:
                    type: object
                    properties:
                      url:
                        type: string
                        format: url
                        description: |
                          URL DA dei documenti da firmare.
                      name:
                        type: string
                        description: |
                          Nome del documento. Questo viene utilizzato nell'email della richiesta di firma.
          application/x-www-form-urlencoded:
            schema:
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: url
                  description: |
                    URL DA ai documenti da firmare. I precedenti link di firma possono essere riutilizzati.
                    Se viene fornito un link a una richiesta protetta da password, passare anche il parametro `password`.
          multipart/form-data:
            schema:
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Caricare documenti PDF da firmare.
            encoding:
              files:
                contentType: application/pdf
                style: form
      responses:
        200:
          description: La richiesta di firma è stata creata.
          content:
            application/json:
              schema:
                properties:
                  request_url:
                    type: string
                    format: url
                  password:
                    type: string
        400:
          $ref: "#/components/responses/bad_request"
        401:
          $ref: "#/components/responses/unauthorized"
        409:
          description: Il firmatario ha già una richiesta di firma in sospeso per il file.
      tags:
        - Signing

