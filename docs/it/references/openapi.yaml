    get:
      operationId: list_signing_processes
      summary: Elencare i processi di firma
      description: Elenca tutti i processi di firma per l'utente autenticato.
      parameters:
        - name: page
          description: Numero di pagina.
          in: query
          schema:
            type: integer
        - name: size
          description: Numero di elementi per pagina.
          in: query
          schema:
            type: integer
        - name: sort
          description: Campo per cui ordinare (ad esempio name, created_at, status).
          in: query
          schema:
            type: string
        - name: order
          description: Direzione di ordinamento (asc o desc).
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        200:
          description: Un elenco paginato di processi di firma.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/signing_process_list"
        401:
          $ref: "#/components/responses/unauthorized"
      tags:
        - Signing Processes

  /signing-process/{id}:
    get:
      operationId: get_signing_process
      summary: Ottenere un processo di firma tramite ID
      description: Recupera i dettagli di un processo di firma specifico.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: I dettagli del processo di firma.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/signing_process"
        400:
          $ref: "#/components/responses/bad_request"
        401:
          $ref: "#/components/responses/unauthorized"
      tags:
        - Signing Processes

  /signing-process/{id}/cancel:
    post:
      operationId: cancel_signing_process
      summary: Annullare un processo di firma
      description: Annulla un processo di firma tramite il suo ID. È possibile fornire una nota opzionale per informare i firmatari del motivo dell'annullamento.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  description: Un messaggio ai firmatari che spiega perché il processo è stato annullato.
      responses:
        200:
          description: Il processo di firma è stato annullato.
        400:
          $ref: "#/components/responses/bad_request"
        401:
          $ref: "#/components/responses/unauthorized"
      tags:
        - Signing Processes

  /org/process-reminder:
    get:
      operationId: get_org_process_reminder
      summary: Ottenere il promemoria del processo di firma a livello di organizzazione
      description: |
        Restituisce il valore analizzato dell'impostazione `organization.signingprocess.reminder`
        per l'organizzazione del chiamante. Restituisce un oggetto vuoto (`{}`) quando
        l'impostazione non è definita (nessuna riga, valore vuoto o JSON malformato a monte).

        Il chiamante deve appartenere a esattamente un'organizzazione; in caso contrario la richiesta
        viene rifiutata con 400.
      responses:
        200:
          description: Il valore analizzato dell'impostazione, o `{}` quando non definito.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/org_reminder"
        400:
          description: Il chiamante non appartiene a una singola organizzazione risolvibile.
        401:
          $ref: "#/components/responses/unauthorized"
        500:
          description: Impossibile raggiungere l'API a monte.
      tags:
        - Organization

    post:
      operationId: set_org_process_reminder
      summary: Impostare il promemoria del processo di firma a livello di organizzazione
      description: |
        Crea o aggiorna l'impostazione `organization.signingprocess.reminder` sull'organizzazione
        del chiamante. La CLI converte i parametri di query nella struttura JSON che
        l'endpoint a monte `/setting/:entity_id` si aspetta.

        Solo un amministratore dell'organizzazione può scrivere questa impostazione. Una volta che
        `enforced=true` (il valore predefinito), l'API a monte aggiorna anche in blocco ogni
        modello esistente nell'organizzazione che ha già promemoria, nella stessa transazione
        di database della scrittura dell'impostazione.

        Omettere `message` preserva il messaggio esistente di ciascun modello durante la
        sincronizzazione di massa (`COALESCE` a monte). Inviare `message=` (stringa vuota)
        azzera deliberatamente il messaggio di ogni modello.
      parameters:
        - name: interval
          description: Cadenza del promemoria in giorni (1-14).
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 14
        - name: max
          description: Numero massimo di promemoria (1-5).
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5
        - name: message
          description: |
            Corpo del messaggio di promemoria (massimo 500 caratteri). Omettere per preservare
            i messaggi per modello; inviare un valore vuoto per azzerarli.
          in: query
          schema:
            type: string
            maxLength: 500
        - name: enforced
          description: |
            Se il promemoria dell'organizzazione sovrascrive i valori per singola richiesta e per modello.
            Il valore predefinito è `true`. Passare `false` per contrassegnare l'impostazione come inattiva senza
            eliminarla.
          in: query
          schema:
            type: boolean
            default: true
      responses:
        200:
          description: L'impostazione è stata creata o aggiornata con successo.
        400:
          description: Impossibile analizzare un parametro di query oppure il chiamante non appartiene a una singola organizzazione risolvibile.
        401:
          $ref: "#/components/responses/unauthorized"
        403:
          description: Il chiamante non è un amministratore dell'organizzazione di destinazione.
        500:
          description: Impossibile raggiungere l'API a monte oppure la sincronizzazione di massa dei modelli è fallita (nel qual caso la scrittura dell'impostazione viene annullata a monte).
      tags:
        - Organization

  /identity/create:
    post:
      operationId: create_identity
      summary: Avvia il processo di identificazione
      requestBody:
        description: L'identità da creare.
        required: true
        content:
          application/json:
            schema:
              properties:
                email:
                  type: string
                  format: email
                  description: L'indirizzo email dell'utente.
                first_name:
                  type: string
                  example: Max
                  description: Il nome dell'utente.
                last_name:
                  type: string
                  example: Muster
                  description: Il cognome dell'utente.
                phone_number:
                  type: string
                  example: "+41794442211"
                  description: Il numero di telefono dell'utente in formato E.164 (ad esempio +41794442211).
                  pattern: '^\+[1-9]\d{1,14}$'
                document_type:
                  type: string
                  description: Il tipo di documento da utilizzare per l'identificazione.
                  enum:
                    - passport
                    - id_card
                jurisdiction:
                  type: string
                  description: Giurisdizione in cui l'identità deve essere valida.
                  enum:
                    - ZertES
                    - eIDAS
      responses:
        200:
          content:
            "application/json":
              schema:
                properties:
                  id:
                    type: string
                    example: 2NxZlu7vlji
                    description: L'ID dell'identità.
                  identification_url:
                    type: string
                    example: https://identifcation.example.com/some_ident_id
                    description: URL per eseguire l'identificazione.
        400:
          description: La richiesta non è formattata correttamente. Ad esempio, il contenuto non può essere letto.
        401:
          description: Non è autorizzato a eseguire l'operazione.
      tags:
        - Account

  /identity/{id}/status:
    get:
      operationId: get_identity_status
      summary: Ottenere lo stato dell'identificazione
      parameters:
        - name: id
          in: path
          example: 2NxZlu7vlji
          required: true
          schema:
            type: string
      responses:
        200:
          content:
            "application/json":
              schema:
                properties:
                  id:
                    type: string
                    example: 2NxZlu7vlji
                    description: L'ID dell'identità.
                  status:
                    type: string
                    enum:
                      - pending
                      - verified
                      - failed
        400:
          description: La richiesta non è formattata correttamente. Ad esempio, il contenuto non può essere letto.
        401:
          description: Non è autorizzato a eseguire l'operazione.
      tags:
        - Account