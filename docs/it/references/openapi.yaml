  /request/file/add:
    post:
      operationId: add_files
      summary: Aggiungere nuovi file alle richieste di firma
      description: |
        Aggiunge documenti a una richiesta di firma, a condizione che la firma sia incompleta. A tale scopo è richiesto l'URL di firma.
        È possibile aggiungere un singolo documento caricando il PDF, con il nome del file come parametro di query.
        Per aggiungere più documenti, inviare un corpo JSON con gli URL e i nomi dei file.
        Se il documento non è ancora stato preparato, verrà preparato automaticamente. Utilizzare `no-prepare` per disabilitare questo comportamento.
        Il valore legale e la giurisdizione saranno gli stessi della richiesta di firma.
      parameters:
        - name: filename
          in: query
          schema:
            type: string
          description: Il nome del file. Questo è richiesto quando si aggiunge un singolo file come caricamento PDF.
        - name: password
          in: query
          schema:
            type: string
          description: La password per la richiesta di firma, se era protetta da password.
        - name: request-url
          in: query
          required: true
          schema:
            type: string
            format: uri
          description: |
            L'URL di firma completo per la richiesta di firma, incluso il frammento `#` contenente la chiave di crittografia.
        - $ref: "#/components/parameters/digital_twin"
        - $ref: "#/components/parameters/pdf-a"
        - $ref: "#/components/parameters/additional_page"
        - $ref: "#/components/parameters/accept_language"
        - name: no-prepare
          in: query
          schema:
            type: boolean
            default: false
          description: Non preparare il documento se non è già preparato e restituire invece un errore.
      requestBody:
        description: Nuovi file da aggiungere alla richiesta di firma.
        required: true
        content:
          application/json:
            schema:
              properties:
                files:
                  type: array
                  items:
                    properties:
                      name:
                        type: string
                      url:
                        type: string
                        format: url
                    required:
                      - name
                      - url
          application/pdf: { }
      responses:
        200:
          description: I documenti sono stati aggiunti con successo.
        400:
          description: Verifichi che i documenti forniti siano stati preparati e possano essere letti, e che ogni informazione richiesta sia stata fornita.
      tags:
        - Signing

  /signing-process/create:
    post:
      operationId: create_signing_process
      summary: Creare un processo di firma
      description: |
        Crea un processo di firma, opzionalmente con richieste di firma.
        Quando viene fornito `signers`, vengono create richieste di firma all'interno del nuovo processo.
        Gli elementi envelope di ciascun firmatario possono contenere `signature_positions` per posizionare
        le firme sui documenti (vedere lo schema `envelope_item_input`).
      requestBody:
        required: true
        description: Corpo JSON con i dettagli del processo di firma.
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                is_individual:
                  type: boolean
                  default: false
                send_email:
                  type: boolean
                  default: false
                signers:
                  type: array
                  description: Elenco opzionale di firmatari con elementi envelope.
                  items:
                    $ref: "#/components/schemas/signer"
                signature_card_template:
                  type: string
                  description: Modello di scheda firma personalizzato (stringa JSON).
                reason:
                  type: string
                  description: Motivo della richiesta di firma.
              required:
                - name
      responses:
        201:
          description: Il processo di firma è stato creato.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/signing_process"
        400:
          $ref: "#/components/responses/bad_request"
        401:
          $ref: "#/components/responses/unauthorized"
      tags:
        - Signing Processes

