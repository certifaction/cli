openapi: "3.0.2"

info:
  title: Certifaction Local API
  description: |
    Ein Proxy-Server für die Integration mit der Certifaction-Plattform.

    ## Einrichtungsanforderungen

    1. Authentifizierung ist erforderlich, um bestimmte Operationen durchzuführen. Bitte beziehen Sie sich auf den Abschnitt [Authentifizierung](https://developers.certifaction.com/de/references/authentication), um einen API-Schlüssel oder Token zu erhalten.
    2. Starten Sie den lokalen Server in der CLI mit dem Befehl `certifaction server`

    Schauen Sie sich [unseren Einrichtungsleitfaden](https://developers.certifaction.com/de/guides/getting-started-api#getting-started-with-the-local-api) an, um zu beginnen.

  version: ""

servers:
  - url: http://localhost:{port}
    variables:
      port:
        default: "8081"

security:
  - api_key: [ ]

tags:
  - name: Signing
    description: Dateien signieren und Signaturen anfordern
  - name: Documents
    description: Ihre Dokumente herunterladen oder den Zugriff von Certifaction darauf entfernen
  - name: Account
    description: Auf Ihre Benutzerkontodaten zugreifen
  - name: Signing Processes
    description: Signaturprozesse erstellen und verwalten
  - name: Organization
    description: Einstellungen auf Organisationsebene verwalten
  - name: Server
    description: Den Serverstatus prüfen
  - name: Certification
    description: Blockchain-Zertifizierung

components:
  parameters:
    additional_page:
      name: additional-page
      description: Ob Digital Twin und Signaturen auf einer zusätzlichen Seite oder inline platziert werden sollen.
      in: query
      schema:
        type: boolean
        default: true
    digital_twin:
      name: digital-twin
      description: "Digital Twin (https://certifaction.com/digital-twin/) für das Dokument aktivieren."
      in: query
      schema:
        type: boolean
        default: false
    pdf-a:
      name: pdf-a
      description: PDF/A-Kompatibilität aktivieren
      in: query
      schema:
        type: boolean
        default: false
    accept_language:
      name: Accept-Language
      description: |
        Die Sprache für Textobjekte, die dem Dokument hinzugefügt werden. Geben Sie `de` für Deutsch, `en` für Englisch,
        `fr` für Französisch oder `it` für Italienisch an.
      in: header
      schema:
        $ref: "#/components/schemas/language"
    prepare_scope:
      name: scope
      in: query
      schema:
        $ref: "#/components/schemas/prepare_scope"
      required: true
    qr_llx:
      name: qr-llx
      description: |
        Die x-Koordinate des Digital Twin QR-Codes von der unteren linken Ecke des Dokuments.
        Dies ist erforderlich, wenn `additional-page=false`.
      in: query
      schema:
        type: number
    qr_lly:
      name: qr-lly
      description: |
        Die y-Koordinate des Digital Twin QR-Codes von der unteren linken Ecke des Dokuments.
        Dies ist erforderlich, wenn `additional-page=false`.
      in: query
      schema:
        type: number
    qr_height:
      name: qr-height
      description: Die Höhe des Digital Twin QR-Codes. Dies ist erforderlich, wenn `additional-page=false`.
      in: query
      schema:
        type: number
    qr_page:
      name: qr-page
      description: Die Seite, auf der der Digital Twin QR-Code platziert werden soll. Dies ist erforderlich, wenn `additional-page=false`.
      in: query
      schema:
        type: integer
    encryption_key:
      name: encryption-key
      description: Eine hexadezimale Zeichenkette zur Verschlüsselung des Dokuments.
      in: query
      schema:
        type: string
    password_encryption:
      name: password-encryption
      description: Der Passwort-Verschlüsselungsalgorithmus zur Verschlüsselung des Verschlüsselungsschlüssels.
      in: query
      schema:
        type: string
        enum:
          - xor-b58
    placeholder:
      name: placeholder
      description: |
        Aktivieren Sie den Platzhalter-Modus, um Signatur-Platzhalter im PDF-Dokument zu erkennen und zu verarbeiten.

        Wenn aktiviert, wird der prepare-Endpunkt:
        - Text-Platzhalter `##SIG{...}` im Dokument erkennen
        - Ihre Positionen für die spätere Signaturplatzierung speichern
        - Den Platzhaltertext aus dem Dokument entfernen

        ## Text-Platzhalter-Format

        Fügen Sie Text-Platzhalter direkt in Ihr PDF-Dokument ein, indem Sie dieses JSON-basierte Format verwenden:

        ```
        ##SIG{"id":"signer1","w":"9cm","x":"2cm","y":"1cm"}
        ```

        ### Feldbeschreibungen

        - **id** (erforderlich): Der Feldname/Bezeichner für den Signatur-Platzhalter
          - Hinweis: `role` kann anstelle von `id` für Rückwärtskompatibilität verwendet werden
        - **w** (optional): Breite des Signaturfelds
          - Unterstützte Einheiten: `cm`, `mm`, `in`, `pt`
          - Wenn angegeben, wird die Höhe automatisch berechnet, um das Seitenverhältnis beizubehalten
          - Beispiele: `"w":"9cm"`, `"w":"100pt"`, `"w":"2in"`
        - **h** (optional): Höhe des Signaturfelds
          - Unterstützte Einheiten: `cm`, `mm`, `in`, `pt`
          - Wird nur verwendet, wenn die Breite (`w`) nicht angegeben ist
          - Beispiele: `"h":"3cm"`
        - **x** (optional): Horizontaler Versatz von der Textposition
          - Unterstützte Einheiten: `cm`, `mm`, `in`, `pt`
          - Positive Werte verschieben die Signatur nach rechts
          - Beispiele: `"x":"2cm"`
        - **y** (optional): Vertikaler Versatz von der Textposition
          - Unterstützte Einheiten: `cm`, `mm`, `in`, `pt`
          - Positive Werte verschieben die Signatur nach unten
          - Beispiele: `"y":"1cm"`

        ### Beispiele

        ```
        ##SIG{"id":"manager","w":"8cm"}
        ##SIG{"id":"director","w":"100pt","x":"1cm","y":"0.5cm"}
        ##SIG{"id":"witness","h":"2cm","x":"3cm"}
        ```

        ### Hinweise

        - Wenn weder `w` noch `h` angegeben ist, verwendet die Signatur die standardmäßige Basisbreite
        - Die Breite (`w`) hat Vorrang vor der Höhe (`h`), um das richtige Seitenverhältnis beizubehalten
        - Positionsversätze (`x`, `y`) sind relativ zu der Stelle, an der der Text `##SIG{...}` im Dokument erscheint
      in: query
      schema:
        type: boolean
        default: false
    placeholder_id:
      name: placeholder-id
      description: |
        ID des Signatur-Platzhalterfelds, das für die Signaturplatzierung verwendet werden soll.
        Wenn angegeben, wird die Signatur an der Position des Platzhalters mit dieser ID platziert.

        Dieser Parameter verweist auf das `id`-Feld in einem `##SIG{...}`-Platzhalter (z.B. für `##SIG{"id":"manager"}` verwenden Sie `placeholder-id=manager`).

        Bei Verwendung dieses Parameters werden positionsbezogene Flags (position-x, position-y, height, page) ignoriert.
      in: query
      schema:
        type: string

  responses:
    bad_request:
      description: Die Anfrage ist nicht ordnungsgemäß formatiert. Beispielsweise konnte der Inhalt nicht gelesen werden.
    unauthorized:
      description: Sie sind nicht berechtigt, die Operation durchzuführen. Prüfen Sie, ob Ihr API-Schlüssel korrekt ist.
    forbidden:
      description: Sie haben keine Berechtigung, die Operation durchzuführen. Beispielsweise haben Sie möglicherweise nicht die erforderliche Rolle.
    not_found:
      description: Die angeforderte Ressource wurde nicht gefunden.
    conflict:
      description: Konflikt in der Anfrage erkannt. Beispielsweise könnte ein Benutzer bereits einer Organisation beigetreten sein.
    internal_server_error:
      description: Ein Fehler ist auf dem Server aufgetreten

  securitySchemes:
    api_key:
      name: Authorization
      in: header
      type: apiKey

  schemas:
    envelope_item_status:
      type: string
      enum:
        - unsigned
        - awaiting_upload
        - signed
        - cancelled

    language:
      type: string
      enum:
        - de
        - en
        - fr
        - it

    legal_weight:
      type: string
      enum:
        - AES
        - QES
        - SES

    scope:
      type: string
      enum:
        - register
        - sign
        - certify
        - revoke
        - retract
    prepare_scope:
      type: string
      enum:
        - sign
        - certify
        - attachment

    identity:
      properties:
        uid:
          type: string
        user_uid:
          type: string
        issuer:
          type: string
        status:
          type: string
        verification_url:
          type: string
        verification_id:
          type: string
        evidence_url:
          type: string
        proof:
          type: string
        name:
          type: string
        given_name:
          type: string
        family_name:
          type: string
        birthday:
          type: string
        signature_level:
          type: string
        signature_jurisdiction:
          type: string
      required:
        - uid
        - user_uid
        - issuer
        - status
        - verification_url
        - verification_id
        - evidence_url
        - proof
        - name
        - given_name
        - family_name
        - birthday

    organization:
      properties:
        id:
          type: string
        name:
          type: string
          maxLength: 80
          minLength: 2
        subscription_type:
          type: string
        quota:
          type: integer
      required:
        - id

    user:
      properties:
        id:
          type: integer
        uid:
          type: string
        external_id:
          type: string
        email:
          type: string
        title:
          type: string
        name:
          type: string
        first_name:
          type: string
        middle_names:
          type: string
        last_name:
          type: string
        affiliation:
          type: string
        address:
          type: string
        postalcode:
          type: string
        location:
          type: string
        eth_address:
          type: string
        quota:
          type: integer
        disabled:
          type: boolean
        file_suffix:
          type: string
        permissions:
          type: array
          items:
            type: string
        subscription_type:
          type: string
        encrypt_claims:
          type: boolean
        verified_by:
          type: string
        features:
          type: object
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/organization"
        identities:
          type: array
          items:
            $ref: "#/components/schemas/identity"
        theme:
          properties:
            name:
              type: string
          required:
            - name
        name_verified:
          type: boolean

    verified_by:
      properties:
        name:
          type: string
        image:
          type: string

    verification_issuer:
      properties:
        id:
          type: string
        title:
          type: string
        name:
          type: string
        email:
          type: string
        verified:
          type: boolean
        verified_by:
          $ref: "#/components/schemas/verified_by"

    blockchain_entry:
      properties:
        type:
          type: string
        contract_address:
          type: string
        tx_hash:
          type: string
        date:
          type: string
          format: date-time

    verification_signature:
      properties:
        jurisdiction:
          type: string
        level:
          type: string
        pkcs7_data:
          type: string

    verification_event:
      properties:
        ref:
          type: string
        encrypted:
          type: boolean
        issuer:
          $ref: "#/components/schemas/verification_issuer"
        scope:
          type: string
        note:
          type: string
        signature:
          $ref: "#/components/schemas/verification_signature"
        date:
          type: string
          format: date-time
        on_blockchain:
          $ref: "#/components/schemas/blockchain_entry"

    verification_file_info:
      properties:
        hash:
          type: string
        status:
          type: string
          enum:
            - registering
            - registered
            - revoking
            - revoked

    verification_result:
      properties:
        verified:
          type: boolean
          description: Ob die Datei verifiziert ist
        authentic:
          type: boolean
          description: Ob die Datei authentisch ist
        on_blockchain:
          type: boolean
          description: Ob die Datei auf der Blockchain ist
        encrypted:
          type: boolean
          description: Ob die Datei verschlüsselt ist
        revoked:
          type: boolean
          description: Ob die Datei widerrufen wurde
        file:
          $ref: "#/components/schemas/verification_file_info"
        events:
          type: array
          items:
            $ref: "#/components/schemas/verification_event"
        claims:
          type: array
          items:
            type: object
        issuer_name:
          type: string
          deprecated: true
          description: "Veraltet: Verwenden Sie stattdessen events.issuer"
        issuer_verifiedby:
          type: string
          deprecated: true
          description: "Veraltet: Verwenden Sie stattdessen events.issuer"
        issuer_img:
          type: string
          deprecated: true
          description: "Veraltet: Verwenden Sie stattdessen events.issuer"
        issuer_address:
          type: string
          deprecated: true
          description: "Veraltet: Verwenden Sie stattdessen events.issuer"
        issuer_verified:
          type: boolean
          deprecated: true
          description: "Veraltet: Verwenden Sie stattdessen events.issuer"
        issuer_title:
          type: string
          deprecated: true
          description: "Veraltet: Verwenden Sie stattdessen events.issuer"

    signer:
      type: object
      properties:
        email:
          type: string
        name:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        language:
          type: string
        message:
          type: string
        sign_order:
          type: integer
        participation_role:
          type: string
          enum: ["signer", "approver", "observer"]
        webhook_url:
          type: string
          format: url
          description: URL zum Empfang von Webhook-Benachrichtigungen über Statusänderungen der Signaturanfrage dieses Unterzeichners.
        envelope_items:
          type: array
          items:
            $ref: "#/components/schemas/envelope_item_input"

    envelope_item_input:
      type: object
      properties:
        link:
          type: string
          description: Digital-Archive-Link für das Dokument.
        file_id:
          type: string
          description: Datei-ID (wird aus dem Link abgeleitet, falls nicht angegeben).
        document_id:
          type: string
          description: Dokument-ID (wird aus dem Link abgeleitet, falls nicht angegeben).
        filename:
          type: string
        legal_weight:
          $ref: "#/components/schemas/legal_weight"
        jurisdiction:
          type: string
          enum: ["ZertES", "eIDAS"]
        signature_position:
          type: string
          deprecated: true
          description: "Veraltet: Verwenden Sie stattdessen `signature_positions`."
        signature_positions:
          type: array
          description: Strukturierte Signaturpositionen, die auf diesem Dokument platziert werden sollen.
          items:
            $ref: "#/components/schemas/signature_position_input"

    envelope_item:
      type: object
      properties:
        link:
          type: string
          description: Digital-Archive-Link für das Dokument.
        file_id:
          type: string
          description: Datei-ID (wird aus dem Link abgeleitet, falls nicht angegeben).
        document_id:
          type: string
          description: Dokument-ID (wird aus dem Link abgeleitet, falls nicht angegeben).
        filename:
          type: string
        legal_weight:
          $ref: "#/components/schemas/legal_weight"
        jurisdiction:
          type: string
          enum: ["ZertES", "eIDAS"]
        signature_position:
          type: string
          deprecated: true
          description: "Veraltet: Verwenden Sie stattdessen `signature_positions`."
        signature_positions:
          type: array
          description: Signaturpositionen für dieses Dokument in der API-Darstellung.
          items:
            $ref: "#/components/schemas/signature_position_output"
        status:
          type: string
          description: Status des Umschlag-Elements (in Antworten vorhanden).
          readOnly: true
          enum: ["unsigned", "awaiting_approval", "awaiting_upload", "signed", "approved", "declined", "declined_confirmed", "cancelled", "attachment", "for_observation"]
        signed_at:
          type: string
          format: date-time

    signature_position_input:
      type: object
      description: |
        Eine strukturierte Signaturposition. Koordinaten sind absolute Einheiten im
        PDF-Benutzerkoordinatensystem oder Bruchteile der Seitenabmessungen, wenn `positioning` "relative" ist.
        Signaturpositionen werden nur für SES-Signaturen unterstützt.
      properties:
        pageNo:
          type: integer
          description: Seitenzahl für die Signaturplatzierung (1-basiert).
        llx:
          type: number
          description: X-Koordinate unten links.
        lly:
          type: number
          description: Y-Koordinate unten links.
        height:
          type: number
          description: Höhe des Signaturfelds.
        rotate:
          type: integer
          description: Drehwinkel in Grad (0, 90, 180, 270).
        positioning:
          type: string
          enum: ["", "relative", "placeholder"]
          description: '"relative" für relative Positionierung, leer für absolute.'
        placeholder:
          type: string
          description: ID eines Signatur-Platzhalterfelds im Dokument, verwendet mit `positioning=placeholder`.
        legalWeight:
          type: string
          description: Rechtsgewicht - nur SES unterstützt.
        jurisdiction:
          type: string
          enum: ["eIDAS", "ZertES"]
          description: Rechtliche Zuständigkeit.

    signature_position_output:
      type: object
      description: Eine von der API zurückgegebene Signaturposition.
      properties:
        position:
          type: string
          description: Die Position, als JSON-Zeichenkette kodiert.
        legal_weight:
          type: string
        jurisdiction:
          type: string
          enum: ["eIDAS", "ZertES"]
        status:
          type: string
        sign_order:
          type: integer

    signature_request_response:
      type: object
      properties:
        id:
          type: string
        signing_process_id:
          type: string
        legal_weight:
          $ref: "#/components/schemas/legal_weight"
        jurisdiction:
          type: string
          enum: ["ZertES", "eIDAS"]
        cancelled:
          type: boolean
        signed:
          type: boolean
        signer:
          $ref: "#/components/schemas/user"
        requester:
          $ref: "#/components/schemas/user"
        envelope_items:
          type: array
          items:
            $ref: "#/components/schemas/envelope_item"
        used_identification_at:
          type: string
          format: date-time
        identification_method:
          type: string
        created_at:
          type: string
          format: date-time

    signing_process:
      properties:
        process_id:
          type: string
        name:
          type: string
        owner_uid:
          type: string
        created_at:
          type: string
          format: date-time
        status:
          type: string
        tag_ids:
          type: array
          items:
            type: string
        is_individual:
          type: boolean
        total:
          type: integer
          description: Gesamtzahl der Dokumente im Signaturprozess.
        signed:
          type: integer
          description: Anzahl der Dokumente, die im Signaturprozess signiert wurden.
        cancelled:
          type: integer
          description: Anzahl der Dokumente, die im Signaturprozess storniert wurden.
        signature_requests:
          type: array
          items:
            $ref: "#/components/schemas/signature_request_response"

    signing_process_list:
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/signing_process"
        total_pages:
          type: integer
        total_elements:
          type: integer
        page:
          type: integer

    org_reminder:
      type: object
      description: |
        Einstellung für Signaturprozess-Erinnerungen auf Organisationsebene
        (`organization.signingprocess.reminder`).

        Wenn `enforced` true ist, überschreiben der Rhythmus und die Nachricht die
        Erinnerungswerte pro Anfrage und pro Vorlage für jeden Signaturprozess in der
        Organisation, und die Upstream-API synchronisiert bestehende Vorlagen, die bereits
        Erinnerungen haben, entsprechend. Wenn `enforced` false ist, ist die Einstellung
        inaktiv und die Werte pro Anfrage / pro Vorlage werden wirksam.

        `message` ist dreiwertig: Lassen Sie das Feld weg, um die bestehende Nachricht
        jeder Vorlage während der Massensynchronisierung beizubehalten, senden Sie eine
        explizite leere Zeichenkette, um die Nachricht jeder Vorlage gezielt zu leeren,
        oder senden Sie eine nicht-leere Zeichenkette, um sie zu überschreiben.
      properties:
        enforced:
          type: boolean
          description: Ob die Organisationsrichtlinie die Erinnerungswerte pro Anfrage und pro Vorlage überschreibt.
        intervals:
          type: integer
          minimum: 1
          maximum: 14
          description: Erinnerungsrhythmus in Tagen.
        max:
          type: integer
          minimum: 1
          maximum: 5
          description: Maximale Anzahl der zu sendenden Erinnerungen.
        message:
          type: string
          maxLength: 500
          description: Text der Erinnerungsnachricht. Weglassen, um bestehende Nachrichten pro Vorlage beizubehalten; `""` senden, um sie zu leeren.

paths:
  /delete-access:
    post:
      operationId: remove_access
      summary: Certifactions Zugriff auf eine Datei entfernen
      requestBody:
        description: Die Datei, für die Sie den Zugriff von Certifaction entfernen möchten.
        required: true
        content:
          application/pdf: { }
      responses:
        200:
          description: Der Dateizugriff wurde erfolgreich entfernt.
        400:
          $ref: "#/components/responses/bad_request"
        401:
          $ref: "#/components/responses/unauthorized"
      tags:
        - Documents

  /download:
    get:
      summary: Dateien herunterladen
      parameters:
        - name: file
          description: Eine Digital Archive URL
          in: query
          required: true
          schema:
            type: string
            format: url
        - name: password
          description: Das Signaturanfrage-Passwort, falls Privacy 2.0 aktiviert war
          in: query
          schema:
            type: string
      operationId: download_file
      responses:
        200:
          description: Datei-Download-Inhalt.
          content:
            application/pdf:
              schema:
                type: string
            application/zip:
              schema:
                type: string
        400:
          $ref: "#/components/responses/bad_request"
        401:
          $ref: "#/components/responses/unauthorized"
      security: [ ]
      tags:
        - Documents

  /health:
    get:
      operationId: server_health_check
      summary: Server-Zustand prüfen
      responses:
        200:
          description: Zustandsprüfungsantwort.
          content:
            application/json:
              schema:
                properties:
                  description:
                    type: string
                  service_name:
                    type: string
                  status:
                    type: string
      security: [ ]
      tags:
        - Server

  /ping:
    get:
      summary: Prüfen, ob der API-Server läuft
      responses:
        200:
          description: Der Server läuft und ist erreichbar.
          content:
            text/plain:
              schema:
                type: string
                enum:
                  - pong
      security: [ ]
      tags:
        - Server

  /prepare:
    post:
      operationId: prepare_file
      parameters:
        - $ref: "#/components/parameters/digital_twin"
        - $ref: "#/components/parameters/pdf-a"
        - $ref: "#/components/parameters/accept_language"
        - $ref: "#/components/parameters/prepare_scope"
        - $ref: "#/components/parameters/additional_page"
        - $ref: "#/components/parameters/qr_llx"
        - $ref: "#/components/parameters/qr_lly"
        - $ref: "#/components/parameters/qr_height"
        - $ref: "#/components/parameters/qr_page"
        - $ref: "#/components/parameters/encryption_key"
        - $ref: "#/components/parameters/password_encryption"
        - $ref: "#/components/parameters/placeholder"
      summary: Eine Datei für die Signierung oder Zertifizierung vorbereiten
      requestBody:
        description: Die vorzubereitende Datei.
        required: true
        content:
          application/pdf: { }
      responses:
        200:
          description: Der Inhalt der vorbereiteten Datei.
          content:
            application/pdf:
              schema:
                type: string
        400:
          $ref: "#/components/responses/bad_request"
        401:
          $ref: "#/components/responses/unauthorized"
      tags:
        - Certification
        - Signing

  /sign:
    post:
      operationId: sign_file
      parameters:
