  /qes/check:
    post:
      summary: Vérifier le statut QES du compte
      requestBody:
        content:
          application/json:
            schema:
              properties:
                jurisdiction:
                  type: string
              required:
                - jurisdiction
      responses:
        200:
          description: QES est activé pour votre compte.
        400:
          $ref: "#/components/responses/bad_request"
        401:
          $ref: "#/components/responses/unauthorized"
        404:
          description: QES est désactivé pour votre compte.
      tags:
        - Account
        - Signing

  /user:
    get:
      operationId: get_user
      summary: Obtenir les données du compte
      responses:
        200:
          description: Les données utilisateur de votre compte.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/user"
        401:
          $ref: "#/components/responses/unauthorized"
      tags:
        - Account

  /request/file/add:
    post:
      operationId: add_files
      summary: Ajouter de nouveaux fichiers aux demandes de signature
      description: |
        Ajoutez des documents à une demande de signature, à condition que la signature soit incomplète. L'URL de signature est requise pour cela.
        Vous pouvez ajouter un seul document en téléversant le PDF, avec le nom de fichier en paramètre de requête.
        Pour ajouter plusieurs documents, soumettez un corps JSON avec les URL et les noms des fichiers.
        Si le document n'a pas encore été préparé, il sera préparé automatiquement. Utilisez `no-prepare` pour désactiver ce comportement.
        Le poids juridique et la juridiction seront les mêmes que dans la demande de signature.
      parameters:
        - name: filename
          in: query
          schema:
            type: string
          description: Le nom du fichier. Ceci est requis lors de l'ajout d'un seul fichier en tant que téléversement PDF.
        - name: password
          in: query
          schema:
            type: string
          description: Le mot de passe de la demande de signature, si elle était protégée par mot de passe.
        - name: request-url
          in: query
          required: true
          schema:
            type: string
            format: uri
          description: |
            L'URL de signature complète pour la demande de signature, y compris le fragment `#` contenant la clé de chiffrement.
        - $ref: "#/components/parameters/digital_twin"
        - $ref: "#/components/parameters/pdf-a"
        - $ref: "#/components/parameters/additional_page"
        - $ref: "#/components/parameters/accept_language"
        - name: no-prepare
          in: query
          schema:
            type: boolean
            default: false
          description: Ne pas préparer le document s'il n'est pas déjà préparé et retourner une erreur à la place.
      requestBody:
        description: Nouveaux fichiers à ajouter à la demande de signature.
        required: true
        content:
          application/json:
            schema:
              properties:
                files:
                  type: array
                  items:
                    properties:
                      name:
                        type: string
                      url:
                        type: string
                        format: url
                    required:
                      - name
                      - url
          application/pdf: { }
      responses:
        200:
          description: Les documents ont été ajoutés avec succès.
        400:
          description: Vérifiez que les documents fournis ont été préparés et peuvent être lus, et que toutes les informations requises ont été fournies.
      tags:
        - Signing

  /signing-process/create:
    post:
      operationId: create_signing_process
      summary: Créer un processus de signature
      description: |
        Crée un processus de signature, éventuellement avec des demandes de signature.
        Lorsque `signers` est fourni, des demandes de signature sont créées au sein du nouveau processus.
        Les éléments d'enveloppe de chaque signataire peuvent comporter `signature_positions` pour placer les
        signatures sur les documents (voir le schéma `envelope_item_input`).
      requestBody:
        required: true
        description: Corps JSON avec les détails du processus de signature.
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                is_individual:
                  type: boolean
                  default: false
                send_email:
                  type: boolean
                  default: false
                signers:
                  type: array
                  description: Liste optionnelle de signataires avec leurs éléments d'enveloppe.
                  items:
                    $ref: "#/components/schemas/signer"
                signature_card_template:
                  type: string
                  description: Modèle personnalisé de carte de signature (chaîne JSON).
                reason:
                  type: string
                  description: Raison de la demande de signature.
              required:
                - name
      responses:
        201:
          description: Le processus de signature a été créé.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/signing_process"
        400:
          $ref: "#/components/responses/bad_request"
        401:
          $ref: "#/components/responses/unauthorized"
      tags:
        - Signing Processes

  /signing-process/list:
    get:
      operationId: list_signing_processes
      summary: Lister les processus de signature
      description: Liste tous les processus de signature pour l'utilisateur authentifié.
      parameters:
        - name: page
          description: Numéro de page.
          in: query
          schema:
            type: integer
        - name: size
          description: Nombre d'éléments par page.
          in: query
          schema:
            type: integer
        - name: sort
          description: Champ par lequel trier (par exemple name, created_at, status).
          in: query
          schema:
            type: string
        - name: order
          description: Sens du tri (asc ou desc).
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        200:
          description: Une liste paginée de processus de signature.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/signing_process_list"
        401:
          $ref: "#/components/responses/unauthorized"
      tags:
        - Signing Processes

  /signing-process/{id}:
    get:
      operationId: get_signing_process
      summary: Obtenir un processus de signature par ID
      description: Récupère les détails d'un processus de signature spécifique.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Les détails du processus de signature.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/signing_process"
        400:
          $ref: "#/components/responses/bad_request"
        401:
          $ref: "#/components/responses/unauthorized"
      tags:
        - Signing Processes

  /signing-process/{id}/cancel:
    post:
      operationId: cancel_signing_process
      summary: Annuler un processus de signature
      description: Annule un processus de signature par son ID. Une note optionnelle peut être fournie pour informer les signataires de la raison de l'annulation.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  description: Un message aux signataires expliquant pourquoi le processus a été annulé.
      responses:
        200:
          description: Le processus de signature a été annulé.
        400:
          $ref: "#/components/responses/bad_request"
        401:
          $ref: "#/components/responses/unauthorized"
      tags:
        - Signing Processes

  /org/process-reminder:
    get:
      operationId: get_org_process_reminder
      summary: Obtenir le rappel de processus de signature au niveau de l'organisation
      description: |
        Retourne la valeur analysée du paramètre `organization.signingprocess.reminder`
        pour l'organisation de l'appelant. Retourne un objet vide (`{}`) lorsque le
        paramètre est indéfini (aucune ligne, valeur vide ou JSON malformé en amont).

        L'appelant doit appartenir à exactement une organisation ; sinon la requête
        est rejetée avec 400.
      responses:
        200:
          description: La valeur analysée du paramètre, ou `{}` lorsqu'elle est indéfinie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/org_reminder"
        400:
          description: L'appelant n'appartient pas à une seule organisation identifiable.
        401:
          $ref: "#/components/responses/unauthorized"
        500:
          description: L'API en amont n'a pas pu être atteinte.
      tags:
        - Organization

    post:
      operationId: set_org_process_reminder
      summary: Définir le rappel de processus de signature au niveau de l'organisation
      description: |
        Met à jour ou insère le paramètre `organization.signingprocess.reminder` sur
        l'organisation de l'appelant. La CLI transforme les paramètres de requête en la
        structure JSON attendue par l'endpoint en amont `/setting/:entity_id`.

        Seul un administrateur de l'organisation peut écrire ce paramètre. Une fois
        `enforced=true` (la valeur par défaut), l'API en amont met également à jour en
        masse chaque modèle existant dans l'organisation qui a déjà des rappels, dans la
        même transaction de base de données que l'écriture du paramètre.

        Omettre `message` préserve le message existant de chaque modèle pendant la
        synchronisation groupée (`COALESCE` en amont). Envoyer `message=` (chaîne vide)
        efface délibérément le message de chaque modèle.
      parameters:
        - name: interval
          description: Cadence de rappel en jours (1-14).
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 14
        - name: max
          description: Nombre maximum de rappels (1-5).
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5
        - name: message
          description: |
            Corps du message de rappel (max 500 caractères). Omettez pour préserver les
            messages par modèle ; envoyez une valeur vide pour les effacer.
          in: query
          schema:
            type: string
            maxLength: 500
        - name: enforced
          description: |
            Si le rappel de l'organisation remplace les valeurs par demande et par modèle.
            Par défaut à `true`. Passez `false` pour marquer le paramètre comme dormant sans
            le supprimer.
          in: query
          schema:
            type: boolean
            default: true
      responses:
        200:
          description: Le paramètre a été mis à jour ou inséré avec succès.
        400:
          description: Un paramètre de requête n'a pas pu être analysé ou l'appelant n'appartient pas à une seule organisation identifiable.
        401:
          $ref: "#/components/responses/unauthorized"
        403:
          description: L'appelant n'est pas un administrateur de l'organisation cible.
        500:
          description: L'API en amont n'a pas pu être atteinte ou la synchronisation groupée des modèles a échoué (auquel cas l'écriture du paramètre est annulée en amont).
      tags:
        - Organization

  /identity/create:
    post:
      operationId: create_identity
      summary: Démarre le processus d'identification
      requestBody:
        description: L'identité à créer.
        required: true
        content:
          application/json:
            schema:
              properties:
                email:
                  type: string
                  format: email
                  description: L'adresse email de l'utilisateur.
                first_name:
                  type: string
                  example: Max
                  description: Le prénom de l'utilisateur.
                last_name:
                  type: string
                  example: Muster
                  description: Le nom de famille de l'utilisateur.
                phone_number:
                  type: string
                  example: "+41794442211"
                  description: Le numéro de téléphone de l'utilisateur au format E.164 (par exemple +41794442211).
                  pattern: '^\+[1-9]\d{1,14}$'
                document_type:
                  type: string
                  description: Le type de document à utiliser pour l'identification.
                  enum:
                    - passport
                    - id_card
                jurisdiction:
                  type: string
                  description: Juridiction dans laquelle l'identité doit être valide.
                  enum:
                    - ZertES
                    - eIDAS
      responses:
        200:
          content:
            "application/json":
              schema:
                properties:
                  id:
                    type: string
                    example: 2NxZlu7vlji
                    description: L'ID de l'identité.
                  identification_url:
                    type: string
                    example: https://identifcation.example.com/some_ident_id
                    description: URL pour effectuer l'identification.
        400:
          description: La requête n'est pas correctement formée. Par exemple, le contenu n'a pas pu être lu.
        401:
          description: Vous n'êtes pas autorisé à effectuer cette opération.
      tags:
        - Account

  /identity/{id}/status:
    get:
      operationId: get_identity_status
      summary: Obtenir le statut d'identification
      parameters:
        - name: id
          in: path
          example: 2NxZlu7vlji
          required: true
          schema:
            type: string
      responses:
        200:
          content:
            "application/json":
              schema:
                properties:
                  id:
                    type: string
                    example: 2NxZlu7vlji
                    description: L'ID de l'identité.
                  status:
                    type: string
                    enum:
                      - pending
                      - verified
                      - failed
        400:
          description: La requête n'est pas correctement formée. Par exemple, le contenu n'a pas pu être lu.
        401:
          description: Vous n'êtes pas autorisé à effectuer cette opération.
      tags:
        - Account