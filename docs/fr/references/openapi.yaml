openapi: "3.0.2"

info:
  title: API Local Certifaction
  description: |
    Un serveur proxy pour l'intégration avec la plateforme Certifaction.

    ## Exigences de configuration

    1. L'authentification est requise pour effectuer certaines opérations. Veuillez vous référer à la section [Authentification](https://developers.certifaction.com/fr/references/authentication) pour obtenir une clé API ou un token.
    2. Démarrez le serveur local sur la CLI en utilisant la commande `certifaction server`

    Référez-vous à [notre guide de configuration](https://developers.certifaction.com/fr/guides/getting-started-api#getting-started-with-the-local-api) pour commencer.

  version: ""

servers:
  - url: http://localhost:{port}
    variables:
      port:
        default: "8081"

security:
  - api_key: [ ]

tags:
  - name: Signing
    description: Signer des fichiers et demander des signatures
  - name: Documents
    description: Télécharger vos documents ou supprimer l'accès de Certifaction à ceux-ci
  - name: Account
    description: Accéder aux données de votre compte utilisateur
  - name: Signing Processes
    description: Créer et gérer des processus de signature
  - name: Organization
    description: Gérer les paramètres au niveau de l'organisation
  - name: Server
    description: Vérifier le statut du serveur
  - name: Certification
    description: Certification blockchain

components:
  parameters:
    additional_page:
      name: additional-page
      description: Placer ou non le Digital Twin et les signatures sur une page supplémentaire ou en ligne.
      in: query
      schema:
        type: boolean
        default: true
    digital_twin:
      name: digital-twin
      description: Activer [Digital Twin](https://certifaction.com/digital-twin/) pour le document.
      in: query
      schema:
        type: boolean
        default: false
    pdf-a:
      name: pdf-a
      description: Activer la compatibilité PDF/A
      in: query
      schema:
        type: boolean
        default: false
    accept_language:
      name: Accept-Language
      description: |
        La langue pour les objets texte ajoutés au document. Passez `de` pour l'allemand, `en` pour l'anglais,
        `fr` pour le français, ou `it` pour l'italien.
      in: header
      schema:
        $ref: "#/components/schemas/language"
    prepare_scope:
      name: scope
      in: query
      schema:
        $ref: "#/components/schemas/prepare_scope"
      required: true
    qr_llx:
      name: qr-llx
      description: |
        La coordonnée x du code QR Digital Twin depuis le coin inférieur gauche du document.
        Ceci est requis quand `additional-page=false`.
      in: query
      schema:
        type: number
    qr_lly:
      name: qr-lly
      description: |
        La coordonnée y du code QR Digital Twin depuis le coin inférieur gauche du document.
        Ceci est requis quand `additional-page=false`.
      in: query
      schema:
        type: number
    qr_height:
      name: qr-height
      description: La hauteur du code QR Digital Twin. Ceci est requis quand `additional-page=false`.
      in: query
      schema:
        type: number
    qr_page:
      name: qr-page
      description: La page sur laquelle placer le code QR Digital Twin. Ceci est requis quand `additional-page=false`.
      in: query
      schema:
        type: integer
    encryption_key:
      name: encryption-key
      description: Une chaîne hexadécimale pour chiffrer le document.
      in: query
      schema:
        type: string
    password_encryption:
      name: password-encryption
      description: L'algorithme de chiffrement de mot de passe à utiliser pour chiffrer la clé de chiffrement.
      in: query
      schema:
        type: string
        enum:
          - xor-b58
    placeholder:
      name: placeholder
      description: |
        Activer le mode espace réservé pour détecter et traiter les espaces réservés de signature dans le document PDF.

        Lorsqu'il est activé, l'endpoint prepare va :
        - Détecter les espaces réservés de texte `##SIG{...}` dans le document
        - Stocker leurs positions pour le placement de signature ultérieur
        - Supprimer le texte d'espace réservé du document

        ## Format des Espaces Réservés de Texte

        Ajoutez des espaces réservés de texte directement dans votre document PDF en utilisant ce format JSON :

        ```
        ##SIG{"id":"signer1","w":"9cm","x":"2cm","y":"1cm"}
        ```

        ### Description des Champs

        - **id** (requis) : Le nom/identifiant du champ pour l'espace réservé de signature
          - Note : `role` peut être utilisé à la place de `id` pour la rétrocompatibilité
        - **w** (optionnel) : Largeur de la zone de signature
          - Unités supportées : `cm`, `mm`, `in`, `pt`
          - Si spécifié, la hauteur est calculée automatiquement pour maintenir le rapport d'aspect
          - Exemples : `"w":"9cm"`, `"w":"100pt"`, `"w":"2in"`
        - **h** (optionnel) : Hauteur de la zone de signature
          - Unités supportées : `cm`, `mm`, `in`, `pt`
          - Utilisé uniquement si la largeur (`w`) n'est pas spécifiée
          - Exemples : `"h":"3cm"`
        - **x** (optionnel) : Décalage horizontal par rapport à la position du texte
          - Unités supportées : `cm`, `mm`, `in`, `pt`
          - Les valeurs positives déplacent la signature vers la droite
          - Exemples : `"x":"2cm"`
        - **y** (optionnel) : Décalage vertical par rapport à la position du texte
          - Unités supportées : `cm`, `mm`, `in`, `pt`
          - Les valeurs positives déplacent la signature vers le bas
          - Exemples : `"y":"1cm"`

        ### Exemples

        ```
        ##SIG{"id":"manager","w":"8cm"}
        ##SIG{"id":"director","w":"100pt","x":"1cm","y":"0.5cm"}
        ##SIG{"id":"witness","h":"2cm","x":"3cm"}
        ```

        ### Remarques

        - Si ni `w` ni `h` n'est spécifié, la signature utilise la largeur de base par défaut
        - La largeur (`w`) prend la priorité sur la hauteur (`h`) pour maintenir le rapport d'aspect approprié
        - Les décalages de position (`x`, `y`) sont relatifs à l'endroit où le texte `##SIG{...}` apparaît dans le document
      in: query
      schema:
        type: boolean
        default: false
    placeholder_id:
      name: placeholder-id
      description: |
        ID du champ d'espace réservé de signature à utiliser pour le placement de la signature.
        Si spécifié, la signature sera placée à la position de l'espace réservé avec cet ID.

        Ce paramètre fait référence au champ `id` dans un espace réservé `##SIG{...}` (par exemple, pour `##SIG{"id":"manager"}`, utilisez `placeholder-id=manager`).

        Lors de l'utilisation de ce paramètre, les indicateurs liés à la position (position-x, position-y, height, page) sont ignorés.
      in: query
      schema:
        type: string

  responses:
    bad_request:
      description: La requête n'est pas correctement formée. Par exemple, le contenu n'a pas pu être lu.
    unauthorized:
      description: Vous n'êtes pas autorisé à effectuer cette opération. Vérifiez que votre clé API est correcte.
    forbidden:
      description: Vous n'avez pas la permission d'effectuer cette opération. Par exemple, vous pourriez ne pas avoir le rôle requis.
    not_found:
      description: La ressource demandée n'a pas été trouvée.
    conflict:
      description: Conflit détecté dans la requête. Par exemple, un utilisateur pourrait avoir déjà rejoint une organisation.
    internal_server_error:
      description: Une erreur s'est produite sur le serveur

  securitySchemes:
    api_key:
      name: Authorization
      in: header
      type: apiKey

  schemas:
    envelope_item_status:
      type: string
      enum:
        - unsigned
        - awaiting_upload
        - signed
        - cancelled

    language:
      type: string
      enum:
        - de
        - en
        - fr
        - it

    legal_weight:
      type: string
      enum:
        - AES
        - QES
        - SES

    scope:
      type: string
      enum:
        - register
        - sign
        - certify
        - revoke
        - retract
    prepare_scope:
      type: string
      enum:
        - sign
        - certify
        - attachment

    identity:
      properties:
        uid:
          type: string
        user_uid:
          type: string
        issuer:
          type: string
        status:
          type: string
        verification_url:
          type: string
        verification_id:
          type: string
        evidence_url:
          type: string
        proof:
          type: string
        name:
          type: string
        given_name:
          type: string
        family_name:
          type: string
        birthday:
          type: string
        signature_level:
          type: string
        signature_jurisdiction:
          type: string
      required:
        - uid
        - user_uid
        - issuer
        - status
        - verification_url
        - verification_id
        - evidence_url
        - proof
        - name
        - given_name
        - family_name
        - birthday

    organization:
      properties:
        id:
          type: string
        name:
          type: string
          maxLength: 80
          minLength: 2
        subscription_type:
          type: string
        quota:
          type: integer
      required:
        - id

    user:
      properties:
        id:
          type: integer
        uid:
          type: string
        external_id:
          type: string
        email:
          type: string
        title:
          type: string
        name:
          type: string
        first_name:
          type: string
        middle_names:
          type: string
        last_name:
          type: string
        affiliation:
          type: string
        address:
          type: string
        postalcode:
          type: string
        location:
          type: string
        eth_address:
          type: string
        quota:
          type: integer
        disabled:
          type: boolean
        file_suffix:
          type: string
        permissions:
          type: array
          items:
            type: string
        subscription_type:
          type: string
        encrypt_claims:
          type: boolean
        verified_by:
          type: string
        features:
          type: object
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/organization"
        identities:
          type: array
          items:
            $ref: "#/components/schemas/identity"
        theme:
          properties:
            name:
              type: string
          required:
            - name
        name_verified:
          type: boolean

    verified_by:
      properties:
        name:
          type: string
        image:
          type: string

    verification_issuer:
      properties:
        id:
          type: string
        title:
          type: string
        name:
          type: string
        email:
          type: string
        verified:
          type: boolean
        verified_by:
          $ref: "#/components/schemas/verified_by"

    blockchain_entry:
      properties:
        type:
          type: string
        contract_address:
          type: string
        tx_hash:
          type: string
        date:
          type: string
          format: date-time

    verification_signature:
      properties:
        jurisdiction:
          type: string
        level:
          type: string
        pkcs7_data:
          type: string

    verification_event:
      properties:
        ref:
          type: string
        encrypted:
          type: boolean
        issuer:
          $ref: "#/components/schemas/verification_issuer"
        scope:
          type: string
        note:
          type: string
        signature:
          $ref: "#/components/schemas/verification_signature"
        date:
          type: string
          format: date-time
        on_blockchain:
          $ref: "#/components/schemas/blockchain_entry"

    verification_file_info:
      properties:
        hash:
          type: string
        status:
          type: string
          enum:
            - registering
            - registered
            - revoking
            - revoked

    verification_result:
      properties:
        verified:
          type: boolean
          description: Si le fichier est vérifié
        authentic:
          type: boolean
          description: Si le fichier est authentique
        on_blockchain:
          type: boolean
          description: Si le fichier est sur la blockchain
        encrypted:
          type: boolean
          description: Si le fichier est chiffré
        revoked:
          type: boolean
          description: Si le fichier a été révoqué
        file:
          $ref: "#/components/schemas/verification_file_info"
        events:
          type: array
          items:
            $ref: "#/components/schemas/verification_event"
        claims:
          type: array
          items:
            type: object
        issuer_name:
          type: string
          deprecated: true
          description: "Obsolète : utilisez events.issuer à la place"
        issuer_verifiedby:
          type: string
          deprecated: true
          description: "Obsolète : utilisez events.issuer à la place"
        issuer_img:
          type: string
          deprecated: true
          description: "Obsolète : utilisez events.issuer à la place"
        issuer_address:
          type: string
          deprecated: true
          description: "Obsolète : utilisez events.issuer à la place"
        issuer_verified:
          type: boolean
          deprecated: true
          description: "Obsolète : utilisez events.issuer à la place"
        issuer_title:
          type: string
          deprecated: true
          description: "Obsolète : utilisez events.issuer à la place"

    signer:
      type: object
      properties:
        email:
          type: string
        name:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        language:
          type: string
        message:
          type: string
        sign_order:
          type: integer
        participation_role:
          type: string
          enum: ["signer", "approver", "observer"]
        webhook_url:
          type: string
          format: url
          description: URL pour recevoir les notifications webhook concernant les changements de statut de la demande de signature de ce signataire.
        envelope_items:
          type: array
          items:
            $ref: "#/components/schemas/envelope_item_input"

    envelope_item_input:
      type: object
      properties:
        link:
          type: string
          description: Lien d'archive numérique pour le document.
        file_id:
          type: string
          description: ID du fichier (dérivé du lien s'il n'est pas fourni).
        document_id:
          type: string
          description: ID du document (dérivé du lien s'il n'est pas fourni).
        filename:
          type: string
        legal_weight:
          $ref: "#/components/schemas/legal_weight"
        jurisdiction:
          type: string
          enum: ["ZertES", "eIDAS"]
        signature_position:
          type: string
          deprecated: true
          description: "Obsolète : utilisez `signature_positions` à la place."
        signature_positions:
          type: array
          description: Positions de signature structurées à placer sur ce document.
          items:
            $ref: "#/components/schemas/signature_position_input"

    envelope_item:
      type: object
      properties:
        link:
          type: string
          description: Lien d'archive numérique pour le document.
        file_id:
          type: string
          description: ID du fichier (dérivé du lien s'il n'est pas fourni).
        document_id:
          type: string
          description: ID du document (dérivé du lien s'il n'est pas fourni).
        filename:
          type: string
        legal_weight:
          $ref: "#/components/schemas/legal_weight"
        jurisdiction:
          type: string
          enum: ["ZertES", "eIDAS"]
        signature_position:
          type: string
          deprecated: true
          description: "Obsolète : utilisez `signature_positions` à la place."
        signature_positions:
          type: array
          description: Positions de signature pour ce document, dans la représentation de l'API.
          items:
            $ref: "#/components/schemas/signature_position_output"
        status:
          type: string
          description: Statut de l'élément d'enveloppe (présent dans les réponses).
          readOnly: true
          enum: ["unsigned", "awaiting_approval", "awaiting_upload", "signed", "approved", "declined", "declined_confirmed", "cancelled", "attachment", "for_observation"]
        signed_at:
          type: string
          format: date-time

    signature_position_input:
      type: object
      description: |
        Une position de signature structurée. Les coordonnées sont en unités absolues
        de l'espace utilisateur PDF, ou en fractions des dimensions de la page lorsque `positioning` est "relative".
        Les positions de signature ne sont supportées que pour les signatures SES.
      properties:
        pageNo:
          type: integer
          description: Numéro de page pour le placement de la signature (à partir de 1).
        llx:
          type: number
          description: Coordonnée X inférieure gauche.
        lly:
          type: number
          description: Coordonnée Y inférieure gauche.
        height:
          type: number
          description: Hauteur du champ de signature.
        rotate:
          type: integer
          description: Angle de rotation en degrés (0, 90, 180, 270).
        positioning:
          type: string
          enum: ["", "relative", "placeholder"]
          description: '"relative" pour un positionnement relatif, vide pour absolu.'
        placeholder:
          type: string
          description: ID d'un champ d'espace réservé de signature dans le document, utilisé avec `positioning=placeholder`.
        legalWeight:
          type: string
          description: Poids juridique - seul SES est supporté.
        jurisdiction:
          type: string
          enum: ["eIDAS", "ZertES"]
          description: Juridiction légale.

    signature_position_output:
      type: object
      description: Une position de signature telle que retournée par l'API.
      properties:
        position:
          type: string
          description: La position, encodée sous forme de chaîne JSON.
        legal_weight:
          type: string
        jurisdiction:
          type: string
          enum: ["eIDAS", "ZertES"]
        status:
          type: string
        sign_order:
          type: integer

    signature_request_response:
      type: object
      properties:
        id:
          type: string
        signing_process_id:
          type: string
        legal_weight:
          $ref: "#/components/schemas/legal_weight"
        jurisdiction:
          type: string
          enum: ["ZertES", "eIDAS"]
        cancelled:
          type: boolean
        signed:
          type: boolean
        signer:
          $ref: "#/components/schemas/user"
        requester:
          $ref: "#/components/schemas/user"
        envelope_items:
          type: array
          items:
            $ref: "#/components/schemas/envelope_item"
        used_identification_at:
          type: string
          format: date-time
        identification_method:
          type: string
        created_at:
          type: string
          format: date-time

    signing_process:
      properties:
        process_id:
          type: string
        name:
          type: string
        owner_uid:
          type: string
        created_at:
          type: string
          format: date-time
        status:
          type: string
        tag_ids:
          type: array
          items:
            type: string
        is_individual:
          type: boolean
        total:
          type: integer
          description: Nombre total de documents dans le processus de signature.
        signed:
          type: integer
          description: Nombre de documents qui ont été signés dans le processus de signature.
        cancelled:
          type: integer
          description: Nombre de documents qui ont été annulés dans le processus de signature.
        signature_requests:
          type: array
          items:
            $ref: "#/components/schemas/signature_request_response"

    signing_process_list:
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/signing_process"
        total_pages:
          type: integer
        total_elements:
          type: integer
        page:
          type: integer

    org_reminder:
      type: object
      description: |
        Paramètre de rappel de processus de signature au niveau de l'organisation
        (`organization.signingprocess.reminder`).

        Lorsque `enforced` est vrai, la cadence et le message remplacent les valeurs
        de rappel par demande et par modèle pour chaque processus de signature dans
        l'organisation, et l'API en amont synchronise les modèles existants qui ont
        déjà des rappels pour qu'ils correspondent. Lorsque `enforced` est faux, le
        paramètre est dormant et les valeurs par demande / par modèle prennent effet.

        `message` a trois états : omettez le champ pour préserver le message existant
        de chaque modèle pendant la synchronisation groupée, envoyez une chaîne vide
        explicite pour effacer délibérément le message de chaque modèle, ou envoyez une
        chaîne non vide pour l'écraser.
      properties:
        enforced:
          type: boolean
          description: Si la politique de l'organisation remplace les valeurs de rappel par demande et par modèle.
        intervals:
          type: integer
          minimum: 1
          maximum: 14
          description: Cadence de rappel en jours.
        max:
          type: integer
          minimum: 1
          maximum: 5
          description: Nombre maximum de rappels à envoyer.
        message:
          type: string
          maxLength: 500
          description: Corps du message de rappel. Omettez pour préserver les messages existants par modèle ; envoyez `""` pour les effacer.

paths:
  /delete-access:
    post:
      operationId: remove_access
      summary: Supprimer l'accès de Certifaction à un fichier
      requestBody:
        description: Le fichier pour lequel vous voulez supprimer l'accès de Certifaction.
        required: true
        content:
          application/pdf: { }
      responses:
        200:
          description: L'accès au fichier a été supprimé avec succès.
        400:
          $ref: "#/components/responses/bad_request"
        401:
          $ref: "#/components/responses/unauthorized"
      tags:
        - Documents

  /download:
    get:
      summary: Télécharger des fichiers
      parameters:
        - name: file
          description: Une URL d'Archive Numérique
          in: query
          required: true
          schema:
            type: string
            format: url
        - name: password
          description: Le mot de passe de la demande de signature, si Privacy 2.0 était activé
          in: query
          schema:
            type: string
      operationId: download_file
      responses:
        200:
          description: Contenu de téléchargement de fichier.
          content:
            application/pdf:
              schema:
                type: string
            application/zip:
              schema:
                type: string
        400:
          $ref: "#/components/responses/bad_request"
        401:
          $ref: "#/components/responses/unauthorized"
      security: [ ]
      tags:
        - Documents

  /health:
    get:
      operationId: server_health_check
      summary: Vérifier l'état de santé du serveur
      responses:
        200:
          description: Réponse de vérification d'état de santé.
          content:
            application/json:
              schema:
                properties:
                  description:
                    type: string
                  service_name:
                    type: string
                  status:
                    type: string
      security: [ ]
      tags:
        - Server

  /ping:
    get:
      summary: Vérifier que le serveur API fonctionne
      responses:
        200:
          description: Le serveur est opérationnel.
          content:
            text/plain:
              schema:
                type: string
                enum:
                  - pong
      security: [ ]
      tags:
        - Server

  /prepare:
    post:
      operationId: prepare_file
      parameters:
        - $ref: "#/components/parameters/digital_twin"
        - $ref: "#/components/parameters/pdf-a"
        - $ref: "#/components/parameters/accept_language"
        - $ref: "#/components/parameters/prepare_scope"
        - $ref: "#/components/parameters/additional_page"
        - $ref: "#/components/parameters/qr_llx"
        - $ref: "#/components/parameters/qr_lly"
        - $ref: "#/components/parameters/qr_height"
        - $ref: "#/components/parameters/qr_page"
        - $ref: "#/components/parameters/encryption_key"
        - $ref: "#/components/parameters/password_encryption"
        - $ref: "#/components/parameters/placeholder"
      summary: Préparer un fichier pour la signature ou la certification
      requestBody:
        description: Le fichier à préparer.
        required: true
        content:
          application/pdf: { }
      responses:
        200:
          description: Le contenu du fichier préparé.
          content:
            application/pdf:
              schema:
                type: string
        400:
          $ref: "#/components/responses/bad_request"
        401:
          $ref: "#/components/responses/unauthorized"
      tags:
        - Certification
        - Signing

  /sign:
    post:
      operationId: sign_file
      parameters:
        - $ref: "#/components/parameters/digital_twin"
        - $ref: "#/components/parameters/pdf-a"
        - $ref: "#/components/parameters/accept_language"
        - $ref: "#/components/parameters/additional_page"
        - $ref: "#/components/parameters/qr_llx"
        - $ref: "#/components/parameters/qr_lly"
        - $ref: "#/components/parameters/qr_height"
        - $ref: "#/components/parameters/qr_page"
        - $ref: "#/components/parameters/encryption_key"
