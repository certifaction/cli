                      properties:
                        id:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                        cancelled:
                          type: boolean
                        envelope_items:
                          type: object
                          properties:
                            legal_weight:
                              $ref: "#/components/schemas/legal_weight"
                            jurisdiction:
                              type: string
                            status:
                              $ref: "#/components/schemas/envelope_item_status"
                            signed_at:
                              type: string
                              format: date-time
                            file_url:
                              type: string
                              format: url
                            file_id:
                              type: string
                        signer:
                          type: object
                          properties:
                            email:
                              type: string
                              format: email
                        used_identification_at:
                          type: string
                          format: date-time
                        identification_method:
                          type: string
        400:
          description: Vérifiez que le fichier fourni a été préparé et peut être lu.
        401:
          $ref: "#/components/responses/unauthorized"
        403:
